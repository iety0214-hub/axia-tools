<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Slackスレッド リンクテスト</title>
<style>
  body { font-family: sans-serif; margin: 16px; background: #fff; color: #222; }
  a { display: block; margin: 12px 0; padding: 14px; border-radius: 8px; background: #4A154B; color: #fff; text-decoration: none; font-size: 18px; }
  p { font-size: 14px; color: #555; }
</style>
</head>
<body>
<h2>Slackスレッド リンクテスト（一時的）</h2>
<p>#案件進捗 の申込投稿を1件開くリンク。1つずつ押して、Slackアプリでそのスレッドが開いたものの記号を教えてください。</p>
<div id="links"></div>
<script>
  var T = 'T08N4SFEAQN', C = 'C08P1PGLHT5', TS = '1790693733.607799', P = 'p' + TS.replace('.', '');
  var host = 'axia-japan.slack.com';
  function si(q) { return 'intent://' + q + '#Intent;scheme=slack;package=com.Slack;end'; }
  var ch = 'team=' + T + '&id=' + C;
  var links = [
    ['I', si('channel?' + ch + '&message=' + TS)],
    ['J', si('channel?' + ch + '&message_ts=' + TS)],
    ['K', si('channel?' + ch + '&thread_ts=' + TS)],
    ['L', si('channel?' + ch + '&ts=' + TS)],
    ['M', si('thread?team=' + T + '&channel=' + C + '&ts=' + TS)],
    ['N', si('thread?team=' + T + '&id=' + C + '&thread_ts=' + TS)],
    ['O', si('message?team=' + T + '&channel=' + C + '&ts=' + TS)],
    ['P', si('permalink?team=' + T + '&url=' + encodeURIComponent('https://' + host + '/archives/' + C + '/' + P))],
    ['Q', 'slack://channel?' + ch + '&message=' + TS]
  ];
  var box = document.getElementById('links');
  links.forEach(function (l) {
    var a = document.createElement('a');
    a.href = l[1];
    a.textContent = l[0];
    box.appendChild(a);
  });
</script>
</body>
</html>
