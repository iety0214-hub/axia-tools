<script>
/* ===== 六星占術エンジン ===== */
function daysFromEpoch(y,m,d){
  const a=Math.floor((14-m)/12);
  const yy=y+4800-a;
  const mm=m+12*a-3;
  const jdn=d+Math.floor((153*mm+2)/5)+365*yy+Math.floor(yy/4)-Math.floor(yy/100)+Math.floor(yy/400)-32045;
  return jdn-2415021; // 1900-01-01=0(甲戌)
}
const STAR_NAMES=["土星人","金星人","火星人","天王星人","木星人","水星人"];
const ETO=["子","丑","寅","卯","辰","巳","午","未","申","酉","戌","亥"];
const PHASES=["種子","緑生","立花","健弱","達成","乱気","再会","財成","安定","陰影","停止","減退"];
const PHASE_DESC={
 "種子":"新しいことを始めるのに最高の年。スタートの運気。",
 "緑生":"始めたことが芽を出す成長の年。土台づくりに◎。",
 "立花":"努力が花開く絶好調の年。人気運・注目運も高め。",
 "健弱":"小殺界。体調と無理に注意しつつ、ペースを守る年。",
 "達成":"目標が実る収穫の年。ここまでの成果が形になる。",
 "乱気":"心が揺らぎやすい年。大きな決断より現状維持が吉。",
 "再会":"努力や縁が復活する年。再スタートに向く。",
 "財成":"金運・実りの年。頑張りがお金や形になって返る。",
 "安定":"心穏やかに過ごせる安定の年。足場を固めるのに◎。",
 "陰影":"大殺界1年目。新しい挑戦は控えめに、守りの年。",
 "停止":"大殺界2年目（中心）。焦らず休むことが最善の年。",
 "減退":"大殺界3年目（出口）。無理せず、次の種まき準備を。"
};
function rokuseiChart(y,m,d){
  const dnum=daysFromEpoch(y,m,d);
  const N=(((dnum+10)%60)+60)%60+1;      // 星数=生日の干支番号(甲子=1)
  const star=Math.floor((N-1)/10);        // 0土星..5水星
  const yb=(((y-4)%12)+12)%12;             // 生年の十二支(暦年・節分調整なし)
  const plus=[0,2,4,6,8,10].includes(yb);
  const pol=plus?"＋":"−";
  const stopBranch=plus?((10-2*star)+12)%12:((10-2*star)+13)%12; // 停止の支
  const reigou=(yb===stopBranch);           // 霊合星人
  const seed=(stopBranch+2)%12;             // 種子の支
  return {N,star,starName:STAR_NAMES[star],pol,typeName:STAR_NAMES[star]+"（"+pol+"）",reigou,yb,seed};
}
function unkiOf(chart, year){
  const by=(((year-4)%12)+12)%12;
  const idx=(by-chart.seed+12)%12;
  const phase=PHASES[idx];
  return {phase,desc:PHASE_DESC[phase],daisatsu:idx>=9,shousatsu:(idx===3)};
}

/* ===== 相性ロジック（六星占術ベース） ===== */
function aishou(s,l){ // s=配信者chart, l=リスナーchart
  let score=50; const reasons=[];
  const ss=s.star, ls=l.star;
  const opposite=(ss+3)%6===ls;
  if(opposite){
    score+=20; reasons.push({t:"運命の対極ペア",d:`${s.starName}と${l.starName}は六星占術で対になる特別な関係。正反対だからこそ強く惹かれ合い、お互いにない魅力を補い合える縁です。`});
  } else if(ss===ls){
    score+=8; reasons.push({t:"同じ星の同志",d:`同じ${s.starName}同士。価値観やツボが似ていて、説明しなくても分かり合える気楽な関係です。`});
  } else {
    const dist=Math.min((ls-ss+6)%6,(ss-ls+6)%6);
    if(dist===1){ score+=13; reasons.push({t:"支え合う隣の星",d:"運命星の並びが隣同士。テンポが近く、自然と応援し合える相性です。"}); }
    else { score+=6; reasons.push({t:"ほどよい距離の星",d:"つかず離れずの心地よい距離感を保てる組み合わせ。安定した長い縁になりやすい相性です。"}); }
  }
  if(s.pol===l.pol){ score+=8; reasons.push({t:"同じ極性（"+s.pol+"）",d:"陰陽が同じで、ノリとテンポがぴったり。一緒に盛り上がりやすい組み合わせです。"}); }
  else { score+=5; reasons.push({t:"陰陽の補い合い",d:"陰陽が逆で、お互いのペースの違いがちょうどいい刺激に。凸凹を補い合える組み合わせです。"}); }
  // 星数の縁(細かい変化)
  const d=Math.abs(s.N-l.N), dc=Math.min(d,60-d);
  score+=Math.round((30-dc)/10)-1;
  if(l.reigou){ reasons.push({t:"霊合星人",d:`このリスナーさんは霊合星人。${l.starName}に加えて対極の星の性質も併せ持つ、奥深い二面性の持ち主です。`}); }
  score=Math.max(8,Math.min(99,score));
  return {score,reasons};
}
function aishouKumikata(score,l){
  const w=LISTENER[l.starName];
  if(score>=80) return "最高の推し関係！"+w.sessikata+" この相性なら少し特別扱いしても大丈夫。長くあなたを支えてくれる大切なリスナーさんです。";
  if(score>=65) return "とても良い相性。"+w.sessikata;
  if(score>=45) return "ほどよい距離感の相性。"+w.sessikata+" 無理に距離を詰めず、自然体で接するのがコツです。";
  return "刺激的な相性。"+w.sessikata+" 反応が読めないこともありますが、それもお互いの個性。淡々と、でも誠実に接するのが一番です。";
}
</script>

<script>
/* ===== 保存 ===== */
const S_KEY='rokusei_streamer_v1', L_KEY='rokusei_members_v1';
function loadStreamer(){ try{return JSON.parse(localStorage.getItem(S_KEY)||'null');}catch(e){return null;} }
function loadMembers(){ try{return JSON.parse(localStorage.getItem(L_KEY)||'[]');}catch(e){return [];} }
function esc(s){return (s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

function saveStreamer(){
  const name=(document.getElementById('sname').value||'').trim();
  const y=+document.getElementById('syear').value, m=+document.getElementById('smonth').value, d=+document.getElementById('sday').value;
  if(!name){ alert('配信者ネームを入力してください。'); return; }
  localStorage.setItem(S_KEY, JSON.stringify({name,y,m,d}));
  renderStreamer(); renderList();
}
function resetStreamer(){
  if(!confirm('配信者設定をやり直しますか？')) return;
  localStorage.removeItem(S_KEY); renderStreamer(); renderList();
}
function renderStreamer(){
  const st=loadStreamer();
  const set=document.getElementById('streamerSet'), form=document.getElementById('streamerForm');
  if(st){
    const c=rokuseiChart(st.y,st.m,st.d);
    const u=unkiOf(c,new Date().getFullYear());
    const satsu=u.daisatsu?'⚠️大殺界':u.phase;
    set.innerHTML=`<div class="streamer-badge">🎤 ${esc(st.name)}（${c.typeName}${c.reigou?'・霊合星人':''}）今年：${satsu}
      <button class="btn sub mini" style="margin-left:auto" onclick="resetStreamer()">変更</button></div>`;
    set.style.display='block'; form.style.display='none';
  } else { set.style.display='none'; form.style.display='block'; }
}
function saveMember(mem){
  const list=loadMembers();
  const i=list.findIndex(x=>x.name===mem.name&&x.y===mem.y&&x.m===mem.m&&x.d===mem.d);
  if(i>=0) list[i]=mem; else list.push(mem);
  localStorage.setItem(L_KEY, JSON.stringify(list));
}
function deleteMember(idx){
  const list=loadMembers();
  if(!confirm(list[idx].name+' を名簿から削除しますか？')) return;
  list.splice(idx,1); localStorage.setItem(L_KEY, JSON.stringify(list)); renderList();
}
function viewMember(idx){
  const m=loadMembers()[idx];
  const c=rokuseiChart(m.y,m.m,m.d); c.name=m.name;
  render(c,{y:m.y,m:m.m,d:m.d});
}
function renderList(){
  const list=loadMembers();
  const card=document.getElementById('listCard'), box=document.getElementById('memberList');
  if(list.length===0){ card.style.display='none'; return; }
  card.style.display='block';
  const st=loadStreamer();
  const sc=st?rokuseiChart(st.y,st.m,st.d):null;
  box.innerHTML=list.map((m,i)=>{
    const c=rokuseiChart(m.y,m.m,m.d);
    let scoreHtml='';
    if(sc){ const a=aishou(sc,c); scoreHtml=`<div class="member-score">💗${a.score}</div>`; }
    return `<div class="member">
      <div class="member-main" onclick="viewMember(${i})">
        <div class="member-name">${esc(m.name)}</div>
        <div class="member-sub">${m.y}/${m.m}/${m.d}　${c.typeName}${c.reigou?'・霊合':''}</div>
      </div>${scoreHtml}
      <button class="member-del" onclick="event.stopPropagation();deleteMember(${i})">削除</button>
    </div>`;
  }).join('');
}

/* ===== 診断 ===== */
function diagnose(save){
  const name=(document.getElementById('pname').value||'').trim();
  const y=+document.getElementById('year').value, m=+document.getElementById('month').value, d=+document.getElementById('day').value;
  if(save){
    if(!name){ alert('リスナーネームを入力してください。'); return; }
    saveMember({name,y,m,d}); renderList();
  }
  const c=rokuseiChart(y,m,d); c.name=name||'リスナーさん';
  render(c,{y,m,d});
}

function render(c,b){
  const w=LISTENER[c.starName];
  const nowY=new Date().getFullYear();
  const u=unkiOf(c,nowY);

  // 相性
  const st=loadStreamer();
  let aiHtml='';
  if(st){
    const sc=rokuseiChart(st.y,st.m,st.d);
    const a=aishou(sc,c);
    const rel=a.reasons.map(r=>`<p style="margin-bottom:6px"><b>✦ ${r.t}</b>：${r.d}</p>`).join('');
    aiHtml=`
    <div class="section">
      <h3>💗 ${esc(st.name)} との相性</h3>
      <div class="aibox">
        <div class="aiscore">${a.score}<small> /100</small></div>
        <div class="airel">${a.score>=80?'運命級の推し！':a.score>=65?'とても良い相性':a.score>=45?'ほどよい相性':'刺激的な相性'}</div>
        <div class="aitext">${rel}</div>
      </div>
      <div class="section">
        <h3>🎀 この人との付き合い方</h3>
        <div class="hl-box">${aishouKumikata(a.score,c)}</div>
      </div>
    </div>`;
  }

  const html=`
  <div class="card">
    <div style="display:flex;align-items:baseline;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-bottom:10px">
      <div style="font-size:21px;font-weight:800">${esc(c.name)}</div>
      <div style="font-size:12px;color:var(--sub)">${b.y}/${b.m}/${b.d} 生まれ</div>
    </div>
    <div style="text-align:center"><span class="star-badge">${c.typeName}${c.reigou?'　✦霊合星人✦':''}</span></div>
    <div class="hitokoto-box">
      <div class="hitokoto-label">ひとことで言うと</div>
      <div class="hitokoto-main">${w.hito}</div>
      <div class="hitokoto-tags">${w.tags.map(t=>`<span class="htag">${t}</span>`).join('')}</div>
    </div>
    <div class="section">
      <h3>🌟 どんなリスナーさん？</h3>
      <p>${w.seikaku}</p>
      <p style="font-size:13px;color:var(--sub)">${w.pm[c.pol]}</p>
      ${c.reigou?`<p style="font-size:13px;color:var(--sub)">さらに霊合星人なので、対極の星（${STAR_NAMES[(c.star+3)%6]}）の性質も併せ持つ、奥深いタイプです。</p>`:''}
    </div>
    <div class="section">
      <h3>💬 コメントの傾向</h3>
      <p>${w.comment}</p>
    </div>
    <div class="section">
      <h3>🎀 喜ばれる絡み方</h3>
      <div class="hl-box">${w.sessikata}</div>
    </div>
    <div class="section">
      <h3>📅 ${nowY}年の運気</h3>
      <div class="unki-box${u.daisatsu?' satsu':''}">
        <span class="unki-name">${u.phase}</span>${u.daisatsu?'（⚠️大殺界）':u.shousatsu?'（小殺界）':''}<br>${u.desc}
        ${u.daisatsu?'<br>今年は運気が低めの時期。無理な絡みより、そっと見守るスタンスが優しさです。':''}
      </div>
    </div>
    ${aiHtml}
  </div>
  <button class="btn" onclick="backToTop()">別のリスナーを診断する</button>
  <footer>六星占術（生年月日からの性格・運気分析）に基づく簡易診断です。<br>エンタメとして楽しみつつ、リスナーさんとの絆づくりの参考に🎤</footer>`;

  const r=document.getElementById('result');
  r.innerHTML=html; r.style.display='block';
  document.getElementById('inputCard').style.display='none';
  document.getElementById('listCard').style.display='none';
  document.getElementById('streamerCard').style.display='none';
  window.scrollTo({top:0,behavior:'smooth'});
}

/* ===== ランキング ===== */
function showRanking(){
  const st=loadStreamer();
  if(!st){ alert('先に配信者（あなた）の生年月日を登録してください。'); return; }
  const list=loadMembers();
  if(list.length===0){ alert('リスナーが登録されていません。'); return; }
  const sc=rokuseiChart(st.y,st.m,st.d);
  const ranked=list.map((m,i)=>{
    const c=rokuseiChart(m.y,m.m,m.d);
    const a=aishou(sc,c);
    return {i,name:m.name,type:c.typeName+(c.reigou?'・霊合':''),hito:LISTENER[c.starName].hito,score:a.score};
  }).sort((a,b)=>b.score-a.score);
  const items=ranked.map((r,rank)=>{
    const cls=rank===0?'top1':rank===1?'top2':rank===2?'top3':'';
    const medal=rank===0?'👑':rank+1;
    return `<div class="rank-item" onclick="viewMember(${r.i})">
      <div class="rank-no ${cls}">${medal}</div>
      <div class="rank-main"><div class="rank-name">${esc(r.name)}</div><div class="rank-sub">${r.type}｜${r.hito}</div></div>
      <div class="rank-score">${r.score}</div>
    </div>`;
  }).join('');
  const html=`
  <div class="card">
    <h2>👑 ${esc(st.name)} の推しリスナーランキング</h2>
    <p class="note" style="margin-bottom:12px">六星占術の相性スコア順。タップで個別診断が見られます。</p>
    ${items}
  </div>
  <button class="btn" onclick="backToTop()">もどる</button>`;
  const r=document.getElementById('result');
  r.innerHTML=html; r.style.display='block';
  document.getElementById('inputCard').style.display='none';
  document.getElementById('listCard').style.display='none';
  document.getElementById('streamerCard').style.display='none';
  window.scrollTo({top:0,behavior:'smooth'});
}

function backToTop(){
  document.getElementById('result').style.display='none';
  document.getElementById('inputCard').style.display='block';
  document.getElementById('streamerCard').style.display='block';
  document.getElementById('pname').value='';
  renderStreamer(); renderList();
  window.scrollTo({top:0,behavior:'smooth'});
}

/* ===== 初期化 ===== */
(function init(){
  for(const [yid,mid,did] of [['syear','smonth','sday'],['year','month','day']]){
    const ys=document.getElementById(yid);
    for(let y=2026;y>=1930;y--){const o=document.createElement('option');o.value=y;o.textContent=y;ys.appendChild(o);}
    ys.value=1995;
    const ms=document.getElementById(mid);
    for(let m=1;m<=12;m++){const o=document.createElement('option');o.value=m;o.textContent=m;ms.appendChild(o);}
    ms.value=6;
    const ds=document.getElementById(did);
    for(let d=1;d<=31;d++){const o=document.createElement('option');o.value=d;o.textContent=d;ds.appendChild(o);}
    ds.value=15;
  }
  renderStreamer(); renderList();
})();
</script>

</body>
</html>
