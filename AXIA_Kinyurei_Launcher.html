// ===================================
// Drive API
// ===================================
const DRIVE_API_BASE = 'https://www.googleapis.com/drive/v3';

async function listFolderContents(folderId) {
  const url = new URL(`${DRIVE_API_BASE}/files`);
  url.searchParams.set('q', `'${folderId}' in parents and trashed=false`);
  url.searchParams.set('fields', 'files(id,name,mimeType,modifiedTime,size,webViewLink)');
  url.searchParams.set('pageSize', '1000');
  url.searchParams.set('orderBy', 'folder,name');
  url.searchParams.set('key', API_KEY);
  url.searchParams.set('supportsAllDrives', 'true');
  url.searchParams.set('includeItemsFromAllDrives', 'true');

  const res = await fetch(url.toString());
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error?.message || `HTTP ${res.status}`);
  return data.files || [];
}

// ===================================
// ヘルパー
// ===================================
const isFolder = (f) => f.mimeType === 'application/vnd.google-apps.folder';
const isPdf = (f) => f.mimeType === 'application/pdf';

const matchRule = (name, rules) => {
  for (const r of rules) {
    if (r.match && name.includes(r.match)) {
      return { tag: r.badge, color: r.color, bg: r.bg };
    }
  }
  return { tag: null, color: '#1e2a4a', bg: '#f5f6fa' };
};

const matchFilter = (file, filter) => {
  switch (filter.type) {
    case 'all': return true;
    case 'mimeFolder': return isFolder(file);
    case 'mimePdf': return isPdf(file);
    case 'contains': return (file.name || '').includes(filter.value);
    case 'notContains': return !(file.name || '').includes(filter.value);
    default: return true;
  }
};

const getFileIcon = (file) => {
  if (isFolder(file)) return '📁';
  if (isPdf(file)) return '📄';
  const mt = file.mimeType || '';
  if (mt.includes('image')) return '🖼️';
  if (mt.includes('video')) return '🎬';
  if (mt.includes('spreadsheet') || mt.includes('excel')) return '📊';
  if (mt.includes('document') || mt.includes('word')) return '📝';
  if (mt.includes('presentation') || mt.includes('powerpoint')) return '📋';
  if (mt.includes('zip') || mt.includes('compressed')) return '🗜️';
  return '📎';
};

const formatSize = (bytes) => {
  if (!bytes) return '';
  const b = Number(bytes);
  if (b < 1024) return `${b} B`;
  if (b < 1024 * 1024) return `${(b / 1024).toFixed(1)} KB`;
  if (b < 1024 * 1024 * 1024) return `${(b / (1024 * 1024)).toFixed(1)} MB`;
  return `${(b / (1024 * 1024 * 1024)).toFixed(1)} GB`;
};

const formatDate = (iso) => {
  if (!iso) return '';
  const d = new Date(iso);
  const now = new Date();
  const diffDays = Math.floor((now - d) / (1000 * 60 * 60 * 24));
  if (diffDays === 0) return '今日';
  if (diffDays === 1) return '昨日';
  if (diffDays < 7) return `${diffDays}日前`;
  if (diffDays < 30) return `${Math.floor(diffDays / 7)}週間前`;
  return `${d.getFullYear()}/${String(d.getMonth()+1).padStart(2,'0')}/${String(d.getDate()).padStart(2,'0')}`;
};

// ===================================
function App() {

  const [files, setFiles] = useState([]);
  const [loading, setLoading] = useState(true);
  const [error, setError] = useState(null);

  const [lastFetch, setLastFetch] = useState(null);
  const [toast, setToast] = useState('');
  const [settingsOpen, setSettingsOpen] = useState(false);

  // 設定（localStorage）
  const [filters, setFilters] = useState(() => storage.loadFilters());
  const [rules, setRules] = useState(() => storage.loadRules());

  useEffect(() => { storage.saveFilters(filters); }, [filters]);
  useEffect(() => { storage.saveRules(rules); }, [rules]);

  const current = pathStack[pathStack.length - 1];

  const fetchCurrent = useCallback(async () => {
    setLoading(true);
    setError(null);
    try {
      const data = await listFolderContents(current.id);
      setFiles(data);
      setLastFetch(new Date());
    } catch (e) {
      setError(e.message || 'データ取得失敗');
    } finally {
      setLoading(false);
    }
  }, [current.id]);

  useEffect(() => { fetchCurrent(); }, [fetchCurrent]);

  const showToast = (msg) => {
    setToast(msg);
    setTimeout(() => setToast(''), 1800);
  };

  // 検索のみ（フォルダ構成をそのまま表示）
  const filtered = useMemo(() => {
    let list = files;
    if (search.trim()) {
      const q = search.trim().toLowerCase();
      list = list.filter(f => (f.name||'').toLowerCase().includes(q));
    }
    return list;
  }, [files, search]);

  const enterFolder = (folder) => {
    setPathStack(s => [...s, { id: folder.id, name: folder.name }]);
    setSearch('');
    window.scrollTo(0, 0);
  };
  const goBack = () => {
    if (pathStack.length <= 1) return;
    setPathStack(s => s.slice(0, -1));
    setSearch('');
    window.scrollTo(0, 0);
  };
  const jumpTo = (idx) => {
    if (idx >= pathStack.length - 1) return;
    setPathStack(s => s.slice(0, idx + 1));
    setSearch('');
    window.scrollTo(0, 0);
  };
  const handleFileClick = (f) => {
    if (isFolder(f)) enterFolder(f);
    else {
      const url = f.webViewLink || `https://drive.google.com/file/d/${f.id}/view`;
      window.open(url, '_blank', 'noopener,noreferrer');
    }
  };

  const folderCount = filtered.filter(isFolder).length;
  const fileCount = filtered.length - folderCount;

  return (
    <div style={S.appBg}>
      <div style={S.header}>
        <div style={S.headerRow}>
          {pathStack.length > 1 ? (
            <button style={S.iconBtn} onClick={goBack} title="戻る">←</button>
          ) : (
            <div style={{...S.iconBtn, background:'rgba(255,255,255,.08)'}}>📝</div>
          )}
          <div style={S.title}>
            <span style={S.titleText}>{current.name}</span>
          </div>
          <div style={S.iconBtnGroup}>
            <button style={S.iconBtn} onClick={fetchCurrent} title="更新">
              <span className={loading ? 'spinner' : ''} style={loading ? {display:'inline-block'} : {}}>↻</span>
            </button>
            <button style={S.iconBtn} onClick={() => setSettingsOpen(true)} title="設定">⚙️</button>
          </div>
        </div>
        <input
          style={S.searchBar}
          placeholder="🔍 ファイル名で検索"
          value={search}
          onChange={e => setSearch(e.target.value)}
        />
      </div>

      {pathStack.length > 1 && (
        <div style={S.breadcrumb}>
          {pathStack.map((p, i) => (
            <React.Fragment key={p.id}>

              {i < pathStack.length - 1 ? (
                <button style={S.crumbBtn} onClick={() => jumpTo(i)}>{p.name}</button>
              ) : (
                <span style={S.crumbCurrent}>{p.name}</span>
              )}
            </React.Fragment>
          ))}
        </div>
      )}

      {lastFetch && !loading && !error && (
        <div style={S.refreshBar}>
          <span>最終更新: {lastFetch.toLocaleTimeString('ja-JP', { hour:'2-digit', minute:'2-digit' })}</span>
          <span>{folderCount} フォルダ / {fileCount} ファイル</span>

      )}

        </div>

        <div style={S.emptyState}>

            <>
              <div style={{ fontSize:32, marginBottom:14 }}>📭</div>

                ① Googleドライブで「各種書類 記入例」を右クリック<br />
                ② 「共有」をクリック<br />
                ③ 「<b style={{ color:'#c8a94a' }}>リンクを知っている全員</b>」になっとる？<br /><br />
                変更したら右上の <b>↻</b> ボタンで再取得！
              </div>
            </>
          ) : '該当するファイルなし'}
        </div>
      ) : (
        <div style={S.fileList} className="fade-in">
          {filtered.map(f => {
            const folder = isFolder(f);
            const meta = matchRule(f.name, rules);
            return (
              <div key={f.id} style={S.fileCard(meta.color)} onClick={() => handleFileClick(f)}>
                <div style={S.fileIcon}>{getFileIcon(f)}</div>
                <div style={S.fileMain}>
                  <div style={S.fileName}>{f.name}</div>
                  <div style={S.fileMeta}>
                    {!folder && f.size && <span>{formatSize(f.size)}</span>}
                    {f.modifiedTime && <span>📅 {formatDate(f.modifiedTime)}</span>}
                  </div>
                </div>
                {meta.tag && <div style={S.fileBadge(meta.color, meta.bg)}>{meta.tag}</div>}
                <div style={S.chevron}>{folder ? '›' : '↗'}</div>
              </div>
            );
          })}
        </div>
      )}

      {settingsOpen && (
        <SettingsModal
          filters={filters}
          setFilters={setFilters}
          rules={rules}
          setRules={setRules}
          onClose={() => setSettingsOpen(false)}
          onToast={showToast}
        />
      )}

      {toast && <div style={S.toast}>{toast}</div>}
    </div>
  );
}

// ===================================
// 設定モーダル
// ===================================
function SettingsModal({ filters, setFilters, rules, setRules, onClose, onToast }) {
  const [tab, setTab] = useState('rules'); // 'rules' | 'misc'
  const [editing, setEditing] = useState(null); // {kind:'filter'|'rule', data}

  const updateFilter = (id, patch) => {
    setFilters(fs => fs.map(f => f.id === id ? { ...f, ...patch } : f));
  };
  const deleteFilter = (id) => {
    if (filters.length <= 1) { alert('最低1つは残してね'); return; }
    if (!confirm('このフィルタを削除する？')) return;
    setFilters(fs => fs.filter(f => f.id !== id));
    onToast('削除した');
  };
  const moveFilter = (id, dir) => {
    setFilters(fs => {
      const idx = fs.findIndex(f => f.id === id);
      const newIdx = idx + dir;
      if (newIdx < 0 || newIdx >= fs.length) return fs;
      const arr = [...fs];
      [arr[idx], arr[newIdx]] = [arr[newIdx], arr[idx]];
      return arr;
    });
  };
  const addFilter = () => {
    const newF = { id: genId('f'), label:'新規', icon:'', type:'contains', value:'' };
    setFilters(fs => [...fs, newF]);
    setEditing({ kind:'filter', data: newF });
  };

  const updateRule = (id, patch) => {
    setRules(rs => rs.map(r => r.id === id ? { ...r, ...patch } : r));
  };
  const deleteRule = (id) => {
    if (!confirm('このルールを削除する？')) return;
    setRules(rs => rs.filter(r => r.id !== id));
    onToast('削除した');
  };
  const moveRule = (id, dir) => {
    setRules(rs => {
      const idx = rs.findIndex(r => r.id === id);
      const newIdx = idx + dir;
      if (newIdx < 0 || newIdx >= rs.length) return rs;
      const arr = [...rs];
      [arr[idx], arr[newIdx]] = [arr[newIdx], arr[idx]];
      return arr;
    });
  };
  const addRule = () => {
    const newR = { id: genId('r'), label:'新規ルール', match:'', color:'#16a34a', bg:'#f0fdf4', badge:'NEW' };
    setRules(rs => [...rs, newR]);
    setEditing({ kind:'rule', data: newR });
  };

  const resetAll = () => {
    if (!confirm('全部デフォルトに戻す？（フィルタ・ルール両方）')) return;
    setFilters(DEFAULT_FILTERS);
    setRules(DEFAULT_RULES);
    onToast('リセットした');
  };

  const exportSettings = () => {
    const data = JSON.stringify({ filters, rules }, null, 2);
    navigator.clipboard.writeText(data).then(() => onToast('クリップボードにコピー'));
  };

  return (
    <div style={S.modalOverlay} onClick={onClose}>
      <div style={S.modalBox} className="slide-up" onClick={e => e.stopPropagation()}>
        <div style={S.modalHeader}>
          <div style={S.modalTitle}>⚙️ 設定</div>
          <button style={S.modalClose} onClick={onClose}>×</button>
        </div>

        <div style={S.settingsTabs}>
          <button style={S.tabBtn(tab==='rules')} onClick={() => setTab('rules')}>🎨 色ルール</button>
          <button style={S.tabBtn(tab==='misc')} onClick={() => setTab('misc')}>🔧 その他</button>
        </div>

        <div style={S.modalBody}>
          {tab === 'rules' && (
            <RulesTab
              rules={rules}
              onEdit={(r) => setEditing({ kind:'rule', data:r })}
              onDelete={deleteRule}
              onMove={moveRule}
              onAdd={addRule}
            />
          )}
          {tab === 'misc' && (
            <MiscTab
              onReset={resetAll}
              onExport={exportSettings}
              filters={filters}
              rules={rules}
            />
          )}
        </div>

        {editing?.kind === 'filter' && (
          <FilterEditModal
            initial={editing.data}
            onClose={() => setEditing(null)}
            onSave={(data) => {
              updateFilter(editing.data.id, data);
              setEditing(null);
              onToast('保存した');
            }}
          />
        )}
        {editing?.kind === 'rule' && (
          <RuleEditModal
            initial={editing.data}
            onClose={() => setEditing(null)}
            onSave={(data) => {
              updateRule(editing.data.id, data);
              setEditing(null);
              onToast('保存した');
            }}
          />
        )}
      </div>
    </div>
  );
}

// ===================================
// フィルタタブ
// ===================================
function FiltersTab({ filters, onEdit, onDelete, onMove, onAdd }) {
  const typeLabel = (type) => ({
    all: 'すべて表示',
    mimeFolder: 'フォルダのみ',
    mimePdf: 'PDFのみ',
    contains: '名前に含む',
    notContains: '名前に含まない',
  })[type] || type;

  return (
    <div>
      <div style={{ fontSize:12, color:'#6b7280', marginBottom:12, lineHeight:1.5 }}>
        画面上部に表示されるフィルタチップ。左から順に表示されるよ。
      </div>
      <button style={S.btnAdd} onClick={onAdd}>＋ フィルタを追加</button>
      {filters.map((f, i) => (
        <div key={f.id} style={S.listItem}>
          <div style={{ fontSize:20, lineHeight:1 }}>{f.icon || '🏷️'}</div>
          <div style={{ flex:1, minWidth:0 }}>
            <div style={{ fontSize:14, fontWeight:600, color:'#1e2a4a' }}>{f.label}</div>
            <div style={{ fontSize:11, color:'#9ca3af', marginTop:2 }}>
              {typeLabel(f.type)}{f.value ? `: 「${f.value}」` : ''}
            </div>
          </div>
          <div style={S.listItemActions}>
            <button style={S.smallBtn()} onClick={() => onMove(f.id, -1)} disabled={i===0}>↑</button>
            <button style={S.smallBtn()} onClick={() => onMove(f.id, 1)} disabled={i===filters.length-1}>↓</button>
            <button style={S.smallBtn()} onClick={() => onEdit(f)}>編集</button>
            <button style={S.smallBtn('danger')} onClick={() => onDelete(f.id)}>削除</button>
          </div>
        </div>
      ))}
    </div>
  );
}

          borderLeft: `4px solid ${r.color}`,

          <div style={{ flex:1, minWidth:0 }}>

            </div>
          </div>

            <button style={S.smallBtn()} onClick={() => onMove(r.id, 1)} disabled={i===rules.length-1}>↓</button>
            <button style={S.smallBtn()} onClick={() => onEdit(r)}>編集</button>
            <button style={S.smallBtn('danger')} onClick={() => onDelete(r.id)}>削除</button>

}

// ===================================
// その他タブ
// ===================================
function MiscTab({ onReset, onExport, filters, rules }) {
  return (
    <div style={{ display:'flex', flexDirection:'column', gap:14 }}>
      <div>
        <div style={{ fontSize:12, color:'#6b7280', marginBottom:8 }}>現在の設定</div>
        <div style={{ ...S.previewBox, marginTop:0 }}>
          <div style={{ fontSize:12 }}>フィルタ: <b>{filters.length}個</b></div>
          <div style={{ fontSize:12 }}>色ルール: <b>{rules.length}個</b></div>
        </div>
      </div>
      <button style={S.btnSecondary} onClick={onExport}>📋 設定をコピー（JSON）</button>
      <button style={S.btnDanger} onClick={onReset}>🔄 全部デフォルトに戻す</button>
      <div style={{ fontSize:11, color:'#9ca3af', lineHeight:1.6, padding:12, background:'#f9fafb', borderRadius:8 }}>
        💡 設定はブラウザに保存されるけん、別端末では別設定になるっちゃ。<br />
        将来Supabase連携すれば全端末同期できる。
      </div>
    </div>
  );
}

// ===================================
// フィルタ編集モーダル
// ===================================
function FilterEditModal({ initial, onClose, onSave }) {
  const [label, setLabel] = useState(initial.label || '');
  const [icon, setIcon] = useState(initial.icon || '');
  const [type, setType] = useState(initial.type || 'contains');
  const [value, setValue] = useState(initial.value || '');

  const needsValue = type === 'contains' || type === 'notContains';

  const submit = () => {
    if (!label.trim()) { alert('ラベル必須っちゃ'); return; }
    if (needsValue && !value.trim()) { alert('文字列必須っちゃ'); return; }
    onSave({ label: label.trim(), icon: icon.trim(), type, value: value.trim() });
  };

  return (
    <div style={{ ...S.modalOverlay, zIndex:60 }} onClick={onClose}>
      <div style={S.modalBox} className="slide-up" onClick={e => e.stopPropagation()}>
        <div style={S.modalHeader}>
          <div style={S.modalTitle}>🏷️ フィルタ編集</div>
          <button style={S.modalClose} onClick={onClose}>×</button>
        </div>
        <div style={{ ...S.modalBody, display:'flex', flexDirection:'column', gap:14 }}>
          <div>
            <label style={S.label}>ラベル *</label>
            <input style={S.input} value={label} onChange={e => setLabel(e.target.value)} placeholder="例: 物件" />
          </div>
          <div>
            <label style={S.label}>アイコン（絵文字1文字）</label>
            <input style={S.input} value={icon} onChange={e => setIcon(e.target.value)} placeholder="例: 🏠" maxLength={2} />
          </div>
          <div>
            <label style={S.label}>条件タイプ</label>
            <select style={S.select} value={type} onChange={e => setType(e.target.value)}>
              <option value="all">すべて表示</option>
              <option value="mimeFolder">フォルダのみ</option>
              <option value="mimePdf">PDFのみ</option>
              <option value="contains">名前に含む</option>
              <option value="notContains">名前に含まない</option>
            </select>
          </div>
          {needsValue && (
            <div>
              <label style={S.label}>含む文字列 *</label>
              <input style={S.input} value={value} onChange={e => setValue(e.target.value)} placeholder="例: 物件、◎、決済" />
            </div>
          )}
          <div style={S.previewBox}>
            <div style={S.previewLabel}>プレビュー</div>
            <button style={S.filterChip(true)}>
              {icon} {label || '(ラベル未入力)'}
            </button>
          </div>
        </div>
        <div style={{ padding:14, borderTop:'1px solid #f3f4f6', display:'flex', gap:8 }}>
          <button style={{ ...S.btnSecondary, flex:1 }} onClick={onClose}>キャンセル</button>
          <button style={{ ...S.btnPrimary, flex:1 }} onClick={submit}>保存</button>
        </div>
      </div>
    </div>
  );
}

// ===================================
// 色ルール編集モーダル
// ===================================
function RuleEditModal({ initial, onClose, onSave }) {
  const [label, setLabel] = useState(initial.label || '');
  const [match, setMatch] = useState(initial.match || '');
  const [badge, setBadge] = useState(initial.badge || '');
  const [color, setColor] = useState(initial.color || '#16a34a');
  const [bg, setBg] = useState(initial.bg || '#f0fdf4');

  const selectPreset = (preset) => {
    setColor(preset.color);
    setBg(preset.bg);
  };

  const submit = () => {
    if (!label.trim()) { alert('ラベル必須っちゃ'); return; }
    if (!match.trim()) { alert('含む文字列必須っちゃ'); return; }
    onSave({ label: label.trim(), match: match.trim(), badge: badge.trim() || label.trim().slice(0,2), color, bg });
  };

  // サンプルファイル名（プレビュー用）
  const sampleName = `テスト物件${match || '?'}サンプル`;

  return (
    <div style={{ ...S.modalOverlay, zIndex:60 }} onClick={onClose}>
      <div style={S.modalBox} className="slide-up" onClick={e => e.stopPropagation()}>
        <div style={S.modalHeader}>
          <div style={S.modalTitle}>🎨 色ルール編集</div>
          <button style={S.modalClose} onClick={onClose}>×</button>
        </div>
        <div style={{ ...S.modalBody, display:'flex', flexDirection:'column', gap:14 }}>
          <div>
            <label style={S.label}>ラベル名 *（管理用）</label>
            <input style={S.input} value={label} onChange={e => setLabel(e.target.value)} placeholder="例: 注目物件" />
          </div>
          <div>
            <label style={S.label}>含む文字列 *</label>
            <input style={S.input} value={match} onChange={e => setMatch(e.target.value)} placeholder="例: ◎、決済済み" />
            <div style={{ fontSize:10, color:'#9ca3af', marginTop:4 }}>
              ファイル名にこの文字列が含まれてたらこのルールが適用される
            </div>
          </div>
          <div>
            <label style={S.label}>バッジ表示（短く2〜3文字推奨）</label>
            <input style={S.input} value={badge} onChange={e => setBadge(e.target.value)} placeholder="例: ◎、済、注目" maxLength={6} />
          </div>
          <div>
            <label style={S.label}>カラープリセット</label>
            <div style={S.colorGrid}>
              {COLOR_PRESETS.map(p => (
                <button key={p.color}
                  style={S.colorChip(color === p.color, p.color, p.bg)}
                  onClick={() => selectPreset(p)}
                >
                  <div style={S.colorSwatch(p.color)} />
                  <div style={{ ...S.colorName, color: p.color }}>{p.name}</div>
                </button>
              ))}
            </div>
          </div>
          <div>
            <label style={S.label}>カスタムカラー（上級者向け）</label>
            <div style={{ display:'flex', gap:8 }}>
              <div style={{ flex:1 }}>
                <div style={{ fontSize:10, color:'#9ca3af', marginBottom:4 }}>メイン</div>
                <input type="color" value={color} onChange={e => setColor(e.target.value)} style={{ width:'100%', height:36, borderRadius:6, border:'1px solid #d1d5db' }} />
              </div>
              <div style={{ flex:1 }}>
                <div style={{ fontSize:10, color:'#9ca3af', marginBottom:4 }}>背景</div>
                <input type="color" value={bg} onChange={e => setBg(e.target.value)} style={{ width:'100%', height:36, borderRadius:6, border:'1px solid #d1d5db' }} />
              </div>
            </div>
          </div>
          <div style={S.previewBox}>
            <div style={S.previewLabel}>プレビュー</div>
            <div style={{
              ...S.fileCard(color),
              background:'#fff',
              cursor:'default',
            }}>
              <div style={S.fileIcon}>📄</div>
              <div style={S.fileMain}>
                <div style={S.fileName}>{sampleName}</div>
                <div style={S.fileMeta}><span>📅 今日</span></div>
              </div>
              {badge && <div style={S.fileBadge(color, bg)}>{badge}</div>}
              <div style={S.chevron}>↗</div>
            </div>
          </div>
        </div>
        <div style={{ padding:14, borderTop:'1px solid #f3f4f6', display:'flex', gap:8 }}>
          <button style={{ ...S.btnSecondary, flex:1 }} onClick={onClose}>キャンセル</button>
          <button style={{ ...S.btnPrimary, flex:1 }} onClick={submit}>保存</button>
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
