<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>契約作成依頼</title>
    <!-- ホーム画面に置いたときアプリとして開くための一式（相対パスでGitHub Pagesに対応） -->
    <link rel="manifest" href="AXIA_Slack契約作成依頼.webmanifest?v=1">
    <link rel="icon" href="keiyaku-irai/icon-192.png">
    <link rel="apple-touch-icon" sizes="180x180" href="keiyaku-irai/icon-180.png">
    <meta name="theme-color" content="#1B1B26">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="契約作成依頼">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #FFD700 0%, #000000 100%);
            min-height: 100vh;
            padding: 20px 20px 110px;
        }

        .container {
            max-width: 700px;
            margin: 0 auto;
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #FFD700 0%, #000000 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 28px;
            margin-bottom: 8px;
        }

        .header p {
            opacity: 0.9;
            font-size: 14px;
        }

        .form-section {
            padding: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            color: #333;
            font-size: 14px;
        }

        select, input, textarea {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            font-family: inherit;
            transition: all 0.3s ease;
        }

        select:focus, input:focus, textarea:focus {
            outline: none;
            border-color: #FFD700;
            box-shadow: 0 0 0 3px rgba(255, 215, 0, 0.1);
        }

        /* 必須項目は項目名そのものを赤字にする */
        .required {
            color: #ef4444;
        }

        /* 画面下に固定する送信バー */
        .action-bar {
            position: fixed;
            left: 0;
            right: 0;
            bottom: 0;
            padding: 12px 16px;
            padding-bottom: calc(12px + env(safe-area-inset-bottom));
            background: rgba(255, 255, 255, 0.97);
            border-top: 1px solid #e0e0e0;
            box-shadow: 0 -4px 20px rgba(0, 0, 0, 0.12);
            z-index: 500;
        }

        .action-bar-inner {
            max-width: 700px;
            margin: 0 auto;
        }

        .action-bar .btn-slack {
            width: 100%;
            padding: 16px;
            font-size: 17px;
        }

        /* ラベルと編集ボタンを1行に */
        .label-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            margin-bottom: 8px;
        }

        .label-row label {
            margin-bottom: 0;
        }

        .btn-gear {
            background: none;
            border: none;
            color: #667eea;
            font-size: 12px;
            font-weight: 600;
            padding: 4px 6px;
            cursor: pointer;
            flex-shrink: 0;
        }

        .btn-gear:hover {
            text-decoration: underline;
        }

        /* 未入力のその場表示 */
        .error-msg {
            display: none;
            color: #ef4444;
            font-size: 12px;
            font-weight: 600;
            margin-top: 6px;
        }

        .field-error .error-msg {
            display: block;
        }

        .field-error select,
        .field-error input,
        .field-error textarea {
            border-color: #ef4444;
            background: #fff5f5;
        }

        .preview-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            margin-bottom: 15px;
        }

        button {
            padding: 14px 24px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-slack {
            background: #4A154B;
            color: white;
        }

        .btn-slack:hover {
            background: #611f69;
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(74, 21, 75, 0.4);
        }

        .preview-section {
            background: #f8f9fa;
            padding: 30px;
            border-top: 2px solid #e0e0e0;
            display: none;
        }

        .preview-section.active {
            display: block;
        }

        .preview-box {
            background: white;
            padding: 24px;
            border-radius: 8px;
            border: 2px solid #e0e0e0;
            white-space: pre-wrap;
            font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic UI", "Meiryo UI", sans-serif;
            font-size: 14px;
            line-height: 1.8;
            max-height: 500px;
            overflow-y: auto;
            font-weight: 600;
            color: #000;
        }

        .toast {
            position: fixed;
            top: 20px;
            right: 20px;
            background: #10b981;
            color: white;
            padding: 16px 24px;
            border-radius: 8px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
            display: none;
            animation: slideIn 0.3s ease;
            z-index: 1000;
        }

        .toast.active {
            display: block;
        }

        @keyframes slideIn {
            from {
                transform: translateX(400px);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        .info-text {
            font-size: 12px;
            color: #666;
            margin-top: 4px;
        }

        .btn-mini {
            background: #667eea;
            color: #fff;
            padding: 8px 14px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 13px;
        }

        .btn-mini.secondary {
            background: #e0e0e0;
            color: #333;
        }

        .save-row {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 10px;
            font-size: 13px;
            color: #333;
        }

        .save-row input[type="checkbox"] {
            width: 18px;
            height: 18px;
            accent-color: #667eea;
            flex-shrink: 0;
        }

        .modal-backdrop {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            display: none;
            align-items: center;
            justify-content: center;
            padding: 16px;
            z-index: 1000;
        }

        .modal-backdrop.active {
            display: flex;
        }

        .modal {
            background: #fff;
            border-radius: 12px;
            width: 100%;
            max-width: 440px;
            max-height: 80vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .modal-head {
            padding: 16px;
            border-bottom: 1px solid #eee;
            font-weight: 700;
            color: #333;
        }

        .modal-body {
            padding: 16px;
            overflow-y: auto;
        }

        .modal-foot {
            padding: 12px 16px;
            border-top: 1px solid #eee;
            text-align: right;
        }

        .modal-add {
            display: flex;
            gap: 8px;
            margin-bottom: 14px;
        }

        .modal-add input {
            flex: 1;
            min-width: 0;
            padding: 10px 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
        }

        .list-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            padding: 10px 4px;
            border-bottom: 1px solid #f0f0f0;
            font-size: 14px;
            color: #333;
        }

        .add-row-group {
            margin-top: -12px;
        }

        /* 行を追加する小さなボタン */
        .btn-add-row {
            padding: 6px 12px;
            margin-top: 8px;
            background: #f2f4ff;
            border: 1px solid #c7cdf5;
            color: #667eea;
            border-radius: 999px;
            font-size: 12px;
            font-weight: 600;
        }

        .btn-add-row:hover {
            background: #e6e9fb;
        }

        .btn-row-del {
            background: none;
            border: none;
            color: #ef4444;
            font-size: 12px;
            font-weight: 600;
            padding: 4px 6px;
            cursor: pointer;
            flex-shrink: 0;
        }

        .sub-input {
            margin-top: 8px;
        }

        .btn-del {
            background: #ef4444;
            color: #fff;
            border: none;
            border-radius: 6px;
            padding: 6px 12px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            flex-shrink: 0;
        }

        /* 日付＋時間など2つを横に並べる */
        .inline-row {
            display: flex;
            gap: 8px;
        }

        .inline-row > * {
            flex: 1;
            min-width: 0;
        }

        /* 金額入力：右に単位を出す */
        .unit-input {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .unit-input input {
            flex: 1;
            min-width: 0;
            text-align: right;
        }

        .unit-input .unit {
            font-weight: 600;
            color: #333;
            flex-shrink: 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>契約作成依頼</h1>
            <p>赤い項目は必ず入力してください</p>
        </div>

        <div class="form-section">
            <div class="form-group">
                <div class="label-row">
                    <label class="required">投稿先チャンネル</label>
                    <button type="button" class="btn-gear" id="btnChannel">⚙ 変更</button>
                </div>
                <input type="text" id="channelView" readonly style="background: #f0f0f0;">
            </div>

            <div class="form-group">
                <label class="required" for="customerName">お客様名</label>
                <input type="text" id="customerName" placeholder="例：田中　太郎">
                <div class="info-text">「様」は自動で追加されます</div>
            </div>

            <div class="form-group">
                <label for="customerKana">名前（フリガナ）</label>
                <input type="text" id="customerKana" placeholder="例：タナカ　タロウ">
                <div class="info-text">「サマ」は自動で追加されます</div>
            </div>

            <div class="form-group">
                <label for="address">住所</label>
                <input type="text" id="address" placeholder="例：神奈川県横浜市鶴見区北寺尾6-19-10 ○○104号室">
            </div>

            <div class="form-group">
                <label for="email">お客様メールアドレス</label>
                <input type="email" id="email" inputmode="email" autocapitalize="off" placeholder="例：example@gmail.com">
            </div>

            <div class="form-group">
                <div class="label-row">
                    <label class="required" for="propertyName">物件名</label>
                    <button type="button" class="btn-gear" data-edit-list="property">⚙ 物件リスト</button>
                </div>
                <select id="propertyName">
                    <option value="">選択してください</option>
                </select>
            </div>

            <div class="form-group" id="customPropertyGroup" style="display: none;">
                <label>物件名（手入力）</label>
                <input type="text" id="customProperty" placeholder="物件名を入力してください">
                <div class="save-row">
                    <input type="checkbox" id="savePropertyToList">
                    <label for="savePropertyToList" style="margin: 0; font-weight: 500;">この物件名をリストに追加する</label>
                </div>
            </div>

            <div class="form-group">
                <label for="roomNumber">号室</label>
                <input type="text" id="roomNumber" placeholder="例：504号室">
            </div>

            <div class="form-group">
                <div class="label-row">
                    <label class="required" for="bank">金融機関</label>
                    <button type="button" class="btn-gear" data-edit-list="bank">⚙ 銀行リスト</button>
                </div>
                <select id="bank">
                    <option value="">選択してください</option>
                </select>
            </div>

            <div class="form-group" id="customBankGroup" style="display: none;">
                <label>金融機関（手入力）</label>
                <input type="text" id="customBank" placeholder="金融機関名を入力してください">
                <div class="save-row">
                    <input type="checkbox" id="saveBankToList">
                    <label for="saveBankToList" style="margin: 0; font-weight: 500;">この金融機関をリストに追加する</label>
                </div>
            </div>

            <div class="form-group">
                <label for="rate">金利</label>
                <input type="text" id="rate" inputmode="decimal" placeholder="例：2.376">
                <div class="info-text">「%」は自動で追加されます</div>
            </div>

            <div class="form-group">
                <label for="years">借入年数</label>
                <select id="years"></select>
            </div>

            <div class="form-group">
                <label for="price">売買代金</label>
                <div class="unit-input">
                    <input type="text" id="price" class="js-money" inputmode="numeric" placeholder="3,500">
                    <span class="unit">万円</span>
                </div>
            </div>

            <div class="form-group">
                <label for="deposit">手付金</label>
                <select id="deposit">
                    <option value="無し">無し</option>
                    <option value="有り">有り</option>
                </select>
                <div class="unit-input sub-input" id="depositAmountRow" style="display: none;">
                    <input type="text" id="depositAmount" class="js-money" inputmode="numeric" placeholder="10">
                    <span class="unit">万円</span>
                </div>
            </div>

            <div class="form-group">
                <div class="label-row">
                    <label for="expenseLoan">諸費用ローン</label>
                    <a class="btn-gear" id="expenseCalcLink" href="諸費用計算アプリ_楽天_SBI.html" target="_blank" rel="noopener" style="text-decoration: none;">🧮 諸費用計算アプリ</a>
                </div>
                <select id="expenseLoan">
                    <option value="無">無</option>
                    <option value="有">有</option>
                </select>
            </div>

            <div class="form-group" id="expenseLoanAmountGroup" style="display: none;">
                <label for="expenseLoanAmount">諸費用ローン額</label>
                <div class="unit-input">
                    <input type="text" id="expenseLoanAmount" class="js-money" inputmode="numeric" placeholder="85">
                    <span class="unit">万円</span>
                </div>
            </div>

            <div class="form-group">
                <label for="loanAmount">ローン金額</label>
                <input type="text" id="loanAmount" readonly placeholder="売買代金を入れると自動で計算" style="background: #f0f0f0;">
                <div class="info-text">売買代金 − 手付金 ＋ 諸費用ローン額 で自動計算</div>
            </div>

            <div class="form-group">
                <label for="rent">保証賃料</label>
                <div class="unit-input">
                    <input type="text" id="rent" class="js-money" inputmode="numeric" placeholder="84,400">
                    <span class="unit">円</span>
                </div>
            </div>

            <div class="form-group">
                <label class="required" for="contractDate">契約日・時間</label>
                <div class="inline-row">
                    <select id="contractDate"></select>
                    <select id="contractTime"></select>
                </div>
            </div>

            <div class="form-group">
                <label for="place">契約場所</label>
                <select id="place">
                    <option value="">選択してください</option>
                    <option value="ファミレス・喫茶店">ファミレス・喫茶店</option>
                    <option value="自宅">自宅</option>
                    <option value="勤務先">勤務先</option>
                    <option value="来社">来社</option>
                </select>
                <input type="text" id="placeName" class="sub-input" placeholder="店名（任意）例：コメダ珈琲店京急川崎駅前店" style="display: none;">
            </div>

            <div class="form-group">
                <div class="label-row">
                    <label class="required" for="personInCharge">担当</label>
                    <button type="button" class="btn-gear" data-edit-list="staff">⚙ 社員リスト</button>
                </div>
                <select id="personInCharge">
                    <option value="">選択してください</option>
                </select>
            </div>

            <div class="form-group">
                <label for="accompany">同行</label>
                <select id="accompany" class="js-accompany-select">
                    <option value="">選択してください</option>
                </select>
            </div>

            <div id="extraAccompany"></div>

            <div class="form-group add-row-group">
                <button type="button" class="btn-add-row" id="btnAddAccompany">＋ 同行者</button>
            </div>

            <div class="form-group">
                <label for="takken">立会宅建士</label>
                <select id="takken">
                    <option value="有">有</option>
                    <option value="無">無</option>
                </select>
            </div>

            <div class="form-group">
                <label for="remarks">備考</label>
                <textarea id="remarks" rows="3" placeholder="例：駐車場あり、書類持参など" style="resize: vertical;"></textarea>
            </div>
        </div>

        <div class="preview-section" id="previewSection">
            <div class="preview-head">
                <h3 style="color: #333;">📋 プレビュー</h3>
                <div style="display: flex; gap: 8px;">
                    <button type="button" class="btn-mini secondary" id="btnCopy">コピー</button>
                    <a class="btn-mini" id="slackLink" target="_blank" rel="noopener" style="background: #4A154B; text-decoration: none;">Slackを開く</a>
                </div>
            </div>
            <div class="preview-box" id="previewBox"></div>
        </div>
    </div>

    <div class="action-bar">
        <div class="action-bar-inner">
            <button class="btn-slack" type="button" id="btnSlack">Slack投稿</button>
        </div>
    </div>

    <div class="modal-backdrop" id="listModal">
        <div class="modal">
            <div class="modal-head" id="listModalTitle">リストを編集</div>
            <div class="modal-body">
                <div class="modal-add">
                    <input type="text" id="listModalInput" placeholder="追加する項目を入力">
                    <button type="button" class="btn-mini" id="listModalAdd">追加</button>
                </div>
                <div id="listModalItems"></div>
            </div>
            <div class="modal-foot">
                <button type="button" class="btn-mini secondary" id="listModalClose">閉じる</button>
            </div>
        </div>
    </div>

    <div class="modal-backdrop" id="channelModal">
        <div class="modal">
            <div class="modal-head">投稿先チャンネルの設定</div>
            <div class="modal-body">
                <div class="form-group">
                    <label for="setChannel">チャンネルID（C○○）</label>
                    <input type="text" id="setChannel" autocapitalize="characters" placeholder="例：C08P1PGLHT5">
                    <div class="info-text">#案件進捗：C08P1PGLHT5 ／ 営業：C08P1MWKVT5 ／ 全体：C08N4SFRQF8</div>
                </div>
                <div class="form-group">
                    <label for="setTeam">Team ID（T○○）</label>
                    <input type="text" id="setTeam" autocapitalize="characters" placeholder="例：T08N4SFEAQN">
                    <div class="info-text">Team IDが無いとSlackのホーム画面で止まります</div>
                </div>
            </div>
            <div class="modal-foot">
                <button type="button" class="btn-mini secondary" id="channelModalClose">閉じる</button>
                <button type="button" class="btn-mini" id="channelModalSave">保存</button>
            </div>
        </div>
    </div>

    <div class="toast" id="toast">コピーしました！</div>

    <script>
        // ========== 投稿先（Slack） ==========
        const SK = 'axia_keiyaku_irai_v2';
        const DEFAULTS = { channel: 'C08P1PGLHT5', team: 'T08N4SFEAQN' };

        function loadSettings() {
            try {
                return Object.assign({}, DEFAULTS, JSON.parse(localStorage.getItem(SK) || '{}'));
            } catch (e) {
                return Object.assign({}, DEFAULTS);
            }
        }

        function saveSettings(s) {
            try {
                localStorage.setItem(SK, JSON.stringify(s));
            } catch (e) {
                console.error('設定の保存エラー:', e);
            }
        }

        let settings = loadSettings();
        // 旧バージョンで未保存の値は最新の既定値で補う
        if (!settings.team) { settings.team = DEFAULTS.team; saveSettings(settings); }
        if (!settings.channel) { settings.channel = DEFAULTS.channel; saveSettings(settings); }

        const CHANNEL_NAMES = { 'C08P1PGLHT5': '#案件進捗', 'C08P1MWKVT5': '営業チャンネル', 'C08N4SFRQF8': '全体チャンネル' };

        // 投稿先チャンネルのWeb版URL（ボタンが効かないときに押すリンク用）
        function slackWebUrl() {
            return 'https://app.slack.com/client/' + encodeURIComponent(settings.team) + '/' + encodeURIComponent(settings.channel);
        }

        function isIOSDevice() {
            const ua = navigator.userAgent;
            if (/iPhone|iPad|iPod/i.test(ua)) return true;
            return /Macintosh/.test(ua) && navigator.maxTouchPoints > 1;
        }

        function isAndroidDevice() {
            return /Android/i.test(navigator.userAgent);
        }

        // Slackアプリでチャンネルを開くURL（team と id の両方が無いとホーム画面で止まる）
        // Androidは slack:// だと開かない端末があるので intent:// でSlackアプリを直接指定する
        function slackAppUrl() {
            const query = 'team=' + encodeURIComponent(settings.team) + '&id=' + encodeURIComponent(settings.channel);
            if (isAndroidDevice()) {
                return 'intent://channel?' + query +
                    '#Intent;scheme=slack;package=com.Slack;S.browser_fallback_url=' +
                    encodeURIComponent(slackWebUrl()) + ';end';
            }
            return 'slack://channel?' + query;
        }

        function isEmbedded() {
            try { return window.top !== window.self; } catch (e) { return true; }
        }

        function renderChannelView() {

        // リスト取得（保存が無ければ初期値）
        function getList(type) {
            const def = LIST_DEFS[type];
            try {
                const saved = localStorage.getItem(def.key);
                if (saved) {
                    const arr = JSON.parse(saved);
                    if (Array.isArray(arr) && arr.length > 0) return arr;
                }
            } catch (e) {
                console.error('リスト読み込みエラー:', e);
            }
            return def.defaults.slice();
        }

        // リスト保存＋ドロップダウン再描画
        function setList(type, arr) {
            const def = LIST_DEFS[type];
            try {
                localStorage.setItem(def.key, JSON.stringify(arr));
            } catch (e) {
                console.error('リスト保存エラー:', e);
            }
            def.render();
        }

        function addToList(type, name) {
            const arr = getList(type);
            if (arr.indexOf(name) !== -1) return false;
            arr.push(name);
            setList(type, arr);
            return true;
        }

        function fillSelectEl(select, items, options) {
            if (!select) return;
            const current = select.value;
            const opts = options || {};

            select.innerHTML = '';
            const placeholder = document.createElement('option');
            placeholder.value = '';
            placeholder.textContent = '選択してください';
            select.appendChild(placeholder);

            items.forEach(function(name) {
                const option = document.createElement('option');
                option.value = name;
                option.textContent = name;
                select.appendChild(option);
            });

            if (opts.custom) {
                const other = document.createElement('option');
                other.value = 'その他';
                other.textContent = '✏️ その他（手入力）';
                select.appendChild(other);
            }

            select.value = current;
            if (select.value !== current) select.value = '';
        }

        // ========== 諸費用計算アプリとの連携 ==========
        // 売買代金・銀行を渡して開き、向こうで計算した上乗せ諸費用を
        // localStorage 経由で受け取って「諸費用ローン額」に入れる（同じサイトなので共有できる）
        const SHOHIYO_KEY = 'axia_shohiyo_for_keiyaku';

        function openExpenseCalc() {
            const params = new URLSearchParams({ from: 'keiyaku' });
            const bank = document.getElementById('bank').value === 'その他'
                ? document.getElementById('customBank').value : document.getElementById('bank').value;
            if (/SBI/i.test(bank)) params.set('bank', 'sbi');
            const price = moneyValue('price');
            if (price) params.set('price', String(price));

            // 開いた時刻より後の計算結果だけを受け取る
            try { sessionStorage.setItem('shohiyoOpenedAt', String(Date.now())); } catch (e) {}

            const url = document.getElementById('expenseCalcLink').getAttribute('href').split('?')[0] + '?' + params.toString();
            const win = window.open(url, '_blank');
            if (!win) showToast('「🧮 諸費用計算アプリ」を押して開いてください', 'error');
        }

        function applyExpenseCalcResult() {
            let result = null;
            let openedAt = 0;
            try {
                result = JSON.parse(localStorage.getItem(SHOHIYO_KEY) || 'null');
                openedAt = Number(sessionStorage.getItem('shohiyoOpenedAt') || 0);
            } catch (e) {
                return;
            }
            if (!result || !openedAt || result.at < openedAt) return;

            const expenseLoan = document.getElementById('expenseLoan');
            if (expenseLoan.value !== '有') {
                expenseLoan.value = '有';
                document.getElementById('expenseLoanAmountGroup').style.display = 'block';
            }
            // 上乗せ諸費用は万円単位で入れる（楽天は万円未満・SBIは10万未満切り捨て済み）
            const text = formatComma(Math.round(result.amount / 10000));
            const input = document.getElementById('expenseLoanAmount');
            if (input.value === text) return;
            input.value = text;
            updateLoanAmount();
            showToast('諸費用ローン額に ' + text + '万円（' + result.bank + '）を反映しました', 'success');
        }

        document.getElementById('expenseCalcLink').addEventListener('click', function(e) {
            e.preventDefault();
            openExpenseCalc();
        });
        // 別タブで計算した瞬間（storage）と、この画面に戻ってきたとき（focus / visibilitychange）に反映
        window.addEventListener('storage', function(e) {
            if (e.key === SHOHIYO_KEY) applyExpenseCalcResult();
        });
        window.addEventListener('focus', applyExpenseCalcResult);
        document.addEventListener('visibilitychange', function() {
            if (!document.hidden) applyExpenseCalcResult();
        });

        // ========== 金額の入力（打ちながら 3,500 のようにカンマを入れる） ==========
        function formatComma(n) {
            return Number(n).toLocaleString('ja-JP');
        }

        // 入力欄の数字だけを取り出す（全角も可）。空なら 0
        function moneyValue(id) {
            const digits = document.getElementById(id).value.replace(/[０-９]/g, function(c) {
                return String.fromCharCode(c.charCodeAt(0) - 0xFEE0);
            }).replace(/[^0-9]/g, '');
            return digits ? parseInt(digits, 10) : 0;
        }

        function formatMoneyInput(el) {
            const n = moneyValue(el.id);
            el.value = el.value.trim() === '' || (!n && !/[0０]/.test(el.value)) ? '' : formatComma(n);
        }

        // ========== ローン金額の自動計算（売買代金 − 手付金 ＋ 諸費用ローン額、すべて万円） ==========
        function updateLoanAmount() {
            const loan = document.getElementById('loanAmount');
            const price = moneyValue('price');
            if (!price) {
                loan.value = '';
                return;
            }
            const deposit = document.getElementById('deposit').value === '有り' ? moneyValue('depositAmount') : 0;
            const expense = document.getElementById('expenseLoan').value === '有' ? moneyValue('expenseLoanAmount') : 0;
            const total = price - deposit + expense;
            loan.value = total > 0 ? formatComma(total) + '万' : '';
        }

            el.addEventListener('input', function() {

        // ========== 書式の整え ==========
        // 末尾に敬称を付ける（すでに付いていればそのまま）
        function withSuffix(value, suffix) {
            if (!value) return '';
            const trimmed = value.replace(/[\s　]+$/, '');
            const bare = suffix.replace(/^[\s　]+/, '');
            return trimmed.endsWith(bare) ? trimmed : trimmed + suffix;
        }

        // 桃井主任 → 桃井（担当は役職なしで出す）
        function withoutTitle(name) {
            return name.replace(/(社長|専務|常務|部長|次長|課長|係長|主任|社員)$/, '') || name;
        }

        // 2026-09-30 + 19:00 → 2026/9/30 19:00〜
        function formatContractDate(date, time) {
            if (!date) return '';
            const p = date.split('-');
            let text = Number(p[0]) + '/' + Number(p[1]) + '/' + Number(p[2]);
            if (time) text += ' ' + time + '〜';
            return text;
        }

        // 数字だけなら単位を付ける
        function withUnit(value, unit) {
            if (!value) return '';
            const half = value.replace(/[０-９．，]/g, function(c) {
                return String.fromCharCode(c.charCodeAt(0) - 0xFEE0);
            });
            return /^[\d.,]+$/.test(half) ? half + unit : value;
        }

        // ========== 本文の生成（成功=true／未入力=false） ==========
        function generateReport() {
            clearFieldErrors();

            const val = function(id) { return document.getElementById(id).value.trim(); };

            const customerName = val('customerName');
            const propertyName = val('propertyName');
            const customProperty = val('customProperty');
            const bank = val('bank');
            const customBank = val('customBank');
            const contractDate = val('contractDate');
            const personInCharge = val('personInCharge');

            // 必須チェック
            if (!customerName) {
                return showFieldError('customerName', 'お客様名を入力してください');
            }
            if (!propertyName) {
                return showFieldError('propertyName', '物件名を選んでください');
            }
            if (propertyName === 'その他' && !customProperty) {
                return showFieldError('customProperty', '物件名を入力してください');
            }
            if (!bank) {
                return showFieldError('bank', '金融機関を選んでください');
            }
            if (bank === 'その他' && !customBank) {
                return showFieldError('customBank', '金融機関名を入力してください');
            }
            if (!contractDate) {
                return showFieldError('contractDate', '契約日を選んでください');
            }
            if (!personInCharge) {
                return showFieldError('personInCharge', '担当を選んでください');
            }

            const deposit = val('deposit');
            const depositAmount = val('depositAmount') ? val('depositAmount') + '万' : '';
            const withMan = function(id) { return val(id) ? val(id) + '万' : ''; };
            const place = val('place') && val('placeName') ? val('place') + '（' + val('placeName') + '）' : val('place');
            const expenseLoan = val('expenseLoan');

            const items = [
                ['お客様名　（例）田中　太郎', withSuffix(customerName, '　様')],
                ['名前（フリガナ）', withSuffix(val('customerKana'), '　サマ')],
                ['住所', val('address')],
                ['お客様メールアドレス', val('email')],
                ['物件名', propertyName === 'その他' ? customProperty : propertyName],
                ['号室', val('roomNumber')],
                ['金融機関', bank === 'その他' ? customBank : bank],
                ['金利', withUnit(val('rate'), '%')],
                ['借入年数', val('years')],
                ['ローン金額（満額の場合は満額と記載）', (updateLoanAmount(), val('loanAmount'))],
                ['売買代金', withMan('price')],
                ['手付金（有・無　※有りの場合金額も記載）', deposit === '有り' && depositAmount ? '有り　' + depositAmount : deposit],
                ['諸費用ローン（有・無）', expenseLoan],
                ['諸費用ローン額', expenseLoan === '有' ? withMan('expenseLoanAmount') : ''],
                ['保証賃料', val('rent') ? val('rent') + '円' : ''],
                ['契約日（西暦）、時間', formatContractDate(contractDate, val('contractTime'))],
                ['契約場所', place],
                ['担当', withoutTitle(personInCharge)],
                ['同行（2人の場合は2人記載）', collectAccompany().join('\n')],
                ['立会宅建士（有・無）', val('takken')],
                ['備考', val('remarks')]
            ];

            // 項目の間に空行は入れない（値が空の項目は見出しだけ）
            const lines = ['契約作成依頼'];
            items.forEach(function(item) {
                lines.push('・' + item[0]);
                if (item[1]) lines.push(item[1]);
            });
            const report = lines.join('\n');

            document.getElementById('previewBox').textContent = report;
            document.getElementById('previewSection').classList.add('active');
            document.getElementById('previewSection').scrollIntoView({ behavior: 'smooth' });

            // 手入力した内容を、チェックが入っていればリストへ保存
            saveCustomEntryIfRequested('property', 'propertyName', 'customProperty', 'customPropertyGroup', 'savePropertyToList');
            saveCustomEntryIfRequested('bank', 'bank', 'customBank', 'customBankGroup', 'saveBankToList');

            return true;
        }

        // ========== コピー ==========
        // クリップボードへコピー（トースト表示なし）
        function copyToClipboard(text) {
            try {
                const ta = document.createElement('textarea');
                ta.value = text;
                ta.style.position = 'fixed';
                ta.style.top = '0';
                ta.style.left = '0';
                ta.style.width = '2em';
                ta.style.height = '2em';
                ta.style.padding = '0';
                ta.style.border = 'none';
                ta.style.outline = 'none';
                ta.style.boxShadow = 'none';
                ta.style.background = 'transparent';
                document.body.appendChild(ta);
                ta.focus();
                ta.select();
                const ok = document.execCommand('copy');
                document.body.removeChild(ta);
                if (!ok && navigator.clipboard) navigator.clipboard.writeText(text);
                return ok;
            } catch (err) {
                console.error('コピーエラー:', err);
                if (navigator.clipboard) navigator.clipboard.writeText(text);
                return false;
            }
        }

        document.getElementById('btnCopy').addEventListener('click', function() {
            const text = document.getElementById('previewBox').textContent;
            if (!text || text.trim() === '') {
                showToast('先に「Slack投稿」を押してください', 'error');
                return;
            }
            if (copyToClipboard(text)) {
                showToast('コピーしました！', 'success');
            } else {
                showToast('コピーに失敗しました。プレビューを長押ししてコピーしてください。', 'error');
            }
        });

        function showToast(message, type) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.style.background = type === 'error' ? '#ef4444' : '#10b981';
            toast.classList.add('active');
            setTimeout(function() {
                toast.classList.remove('active');
            }, 3000);
        }

        // アプリ用のURLを開き、アプリが立ち上がらなければ指定のURLへ切り替える
        function openAppThenFallback(appUrl, fallbackUrl) {
            let left = false;
            const onHide = function() { if (document.hidden) left = true; };
            document.addEventListener('visibilitychange', onHide);
            window.addEventListener('pagehide', function() { left = true; });

            window.location.href = appUrl;

            setTimeout(function() {
                document.removeEventListener('visibilitychange', onHide);
                if (!left && !document.hidden) {
                    window.location.href = fallbackUrl;
                }
            }, 1500);
        }

        // Slack投稿ボタン（生成 → コピー → Slackのチャンネルを開く を一括）
        document.getElementById('btnSlack').addEventListener('click', function() {
            if (!generateReport()) {
                return;
            }

            const copied = copyToClipboard(document.getElementById('previewBox').textContent);

            const webUrl = slackWebUrl();

            // 他のページに埋め込まれて開いているときは、ページ自体を移動させると
            // 読み込みエラーになるので、プレビュー横の「Slackを開く」を押してもらう
            if (isEmbedded()) {
                showToast(copied ? 'コピー完了。「Slackを開く」を押してください' : '生成完了。コピーしてから「Slackを開く」を押してください', copied ? 'success' : 'error');
                return;
            }

            showToast(copied ? 'コピー完了。Slackに貼り付けてください' : '生成完了。プレビューをコピーしてSlackに貼り付けてください', copied ? 'success' : 'error');
            if (isAndroidDevice()) {
                // Androidは intent:// で開く（アプリが無ければWeb版へ）
                window.location.href = slackAppUrl();
            } else {
                openAppThenFallback(slackAppUrl(), webUrl);
            }
        });

        // ページ読み込み時の初期化
        renderChannelView();
        renderPropertySelect();
        renderBankSelect();
        renderStaffSelects();
        renderYears();
        renderContractDates();
        renderContractTimes();
        restoreSelection('personInCharge', 'lastPersonInCharge');
        restoreSelection('accompany', 'lastAccompany');
        rememberSelection('personInCharge', 'lastPersonInCharge');
        rememberSelection('accompany', 'lastAccompany');
    </script>
</body>
</html>
