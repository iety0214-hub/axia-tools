<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<meta name="theme-color" content="#1e2a4a" />
<title>AXIA Drive Launcher</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;background:#f5f6fa;color:#1e2a4a;font-family:'Noto Sans JP',-apple-system,BlinkMacSystemFont,sans-serif;-webkit-font-smoothing:antialiased}
  body{min-height:100vh;overscroll-behavior-y:contain}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;padding:0}
  input,textarea{font-family:inherit}
  .mono{font-family:'DM Mono',monospace}
  ::-webkit-scrollbar{width:8px;height:8px}
  ::-webkit-scrollbar-thumb{background:#c8a94a55;border-radius:4px}
  @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
  .spinner { animation: spin 1s linear infinite; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  .fade-in { animation: fadeIn .25s ease-out; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<script type="text/babel">
const { useState, useEffect, useRef, useMemo, useCallback } = React;

// ===================================
// 設定
// ===================================
const API_KEY = 'AIzaSyCsDfyXG_GskBa2bQzWtXpxOIu7c4TPqHM';
const ROOT_FOLDER_ID = '16jqqTK8YnqHn5lVtjOvH_fK9rrgC1YCP';  // 新事業部共有
const ROOT_NAME = '新事業部共有';

// ===================================
// Drive API クライアント
// ===================================
const DRIVE_API_BASE = 'https://www.googleapis.com/drive/v3';

async function listFolderContents(folderId) {
  const url = new URL(`${DRIVE_API_BASE}/files`);
  url.searchParams.set('q', `'${folderId}' in parents and trashed=false`);
  url.searchParams.set('fields', 'files(id,name,mimeType,modifiedTime,size,webViewLink,iconLink)');
  url.searchParams.set('pageSize', '1000');
  url.searchParams.set('orderBy', 'folder,name');
  url.searchParams.set('key', API_KEY);

  const res = await fetch(url.toString());
  if (!res.ok) {
    const err = await res.json().catch(() => ({}));
    throw new Error(err.error?.message || `HTTP ${res.status}`);
  }
  const data = await res.json();
  return data.files || [];
}

// ===================================
// ファイル分類ヘルパー
// ===================================
const isFolder = (f) => f.mimeType === 'application/vnd.google-apps.folder';
const isPdf = (f) => f.mimeType === 'application/pdf';

const getNameColor = (name) => {
  if (name.includes('◎')) return { tag: '◎', color: '#16a34a', bg: '#f0fdf4' };
  if (name.includes('×')) return { tag: '×', color: '#dc2626', bg: '#fef2f2' };
  if (name.includes('【決済済み】') || name.includes('決済済み')) return { tag: '済', color: '#7c3aed', bg: '#f5f3ff' };
  if (name.includes('【見送り】') || name.includes('見送り')) return { tag: '見送', color: '#6b7280', bg: '#f9fafb' };
  if (name.includes('★') || name.includes('■')) return { tag: '書類', color: '#c8a94a', bg: '#fef9ec' };
  return { tag: null, color: '#1e2a4a', bg: '#f5f6fa' };
};

const getFileIcon = (file) => {
  if (isFolder(file)) return '📁';
  if (isPdf(file)) return '📄';
  const mt = file.mimeType || '';
  if (mt.includes('image')) return '🖼️';
  if (mt.includes('video')) return '🎬';
  if (mt.includes('spreadsheet') || mt.includes('excel')) return '📊';
  if (mt.includes('document') || mt.includes('word')) return '📝';
  if (mt.includes('presentation') || mt.includes('powerpoint')) return '📋';
  if (mt.includes('zip') || mt.includes('compressed')) return '🗜️';
  return '📎';
};

const formatSize = (bytes) => {
  if (!bytes) return '';
  const b = Number(bytes);
  if (b < 1024) return `${b} B`;
  if (b < 1024 * 1024) return `${(b / 1024).toFixed(1)} KB`;
  if (b < 1024 * 1024 * 1024) return `${(b / (1024 * 1024)).toFixed(1)} MB`;
  return `${(b / (1024 * 1024 * 1024)).toFixed(1)} GB`;
};

const formatDate = (iso) => {
  if (!iso) return '';
  const d = new Date(iso);
  const now = new Date();
  const diffMs = now - d;
  const diffDays = Math.floor(diffMs / (1000 * 60 * 60 * 24));
  if (diffDays === 0) return '今日';
  if (diffDays === 1) return '昨日';
  if (diffDays < 7) return `${diffDays}日前`;
  if (diffDays < 30) return `${Math.floor(diffDays / 7)}週間前`;
  return `${d.getFullYear()}/${String(d.getMonth()+1).padStart(2,'0')}/${String(d.getDate()).padStart(2,'0')}`;
};

// ===================================
// スタイル
// ===================================
const S = {
  appBg: { minHeight:'100vh', background:'#f5f6fa', paddingBottom:30 },

  header: {
    position:'sticky', top:0, zIndex:10,
    background:'linear-gradient(135deg, #1e2a4a 0%, #2d3e6b 100%)',
    color:'#fff', padding:'14px 16px 12px',
    boxShadow:'0 2px 10px rgba(30,42,74,.15)',
  },
  headerRow: { display:'flex', alignItems:'center', justifyContent:'space-between', gap:8 },
  title: { fontSize:17, fontWeight:700, letterSpacing:.5, display:'flex', alignItems:'center', gap:8, minWidth:0, flex:1 },
  titleText: { whiteSpace:'nowrap', overflow:'hidden', textOverflow:'ellipsis' },
  iconBtn: {
    width:34, height:34, borderRadius:10,
    background:'rgba(255,255,255,.12)',
    display:'flex', alignItems:'center', justifyContent:'center',
    fontSize:16, color:'#fff', flexShrink:0,
  },
  searchBar: {
    width:'100%', marginTop:10,
    padding:'9px 12px', borderRadius:10,
    background:'rgba(255,255,255,.95)', color:'#1e2a4a',
    border:'none', outline:'none', fontSize:14,
  },

  breadcrumb: {
    padding:'10px 16px 4px',
    display:'flex', alignItems:'center', gap:4, flexWrap:'wrap',
    fontSize:12, color:'#6b7280',
  },
  crumbBtn: { color:'#1e2a4a', fontWeight:600, padding:'2px 4px', textDecoration:'underline' },
  crumbSep: { color:'#9ca3af' },
  crumbCurrent: { color:'#6b7280', padding:'2px 4px' },

  filterBar: {
    padding:'4px 16px 10px',
    display:'flex', gap:6, overflowX:'auto', scrollbarWidth:'none',
  },
  filterChip: (active) => ({
    flex:'0 0 auto', padding:'6px 12px', borderRadius:16,
    fontSize:12, fontWeight:600,
    background: active ? '#1e2a4a' : '#fff',
    color: active ? '#fff' : '#6b7280',
    border: active ? 'none' : '1px solid #e5e7eb',
    whiteSpace:'nowrap',
  }),

  loading: {
    display:'flex', flexDirection:'column', alignItems:'center', justifyContent:'center',
    padding:'80px 20px', gap:14, color:'#6b7280', fontSize:13,
  },
  spinner: {
    width:32, height:32, borderRadius:16,
    border:'3px solid #e5e7eb', borderTopColor:'#c8a94a',
  },

  errorBox: {
    margin:16, padding:14, borderRadius:12,
    background:'#fef2f2', border:'1px solid #fecaca',
    color:'#b91c1c', fontSize:13, lineHeight:1.5,
  },

  fileList: {
    padding:'8px 12px', display:'flex', flexDirection:'column', gap:6,
  },
  fileCard: (color, bg) => ({
    background:'#fff', borderRadius:12, padding:'12px 14px',
    boxShadow:'0 1px 3px rgba(0,0,0,.05), 0 0 0 1px rgba(0,0,0,.03)',
    display:'flex', alignItems:'center', gap:12,
    cursor:'pointer',
    borderLeft:`4px solid ${color}`,
    transition:'transform .08s, box-shadow .08s',
  }),
  fileIcon: { fontSize:24, lineHeight:1, flexShrink:0 },
  fileMain: { flex:1, minWidth:0 },
  fileName: { fontSize:14, fontWeight:600, color:'#1e2a4a', lineHeight:1.35, wordBreak:'break-word' },
  fileMeta: { fontSize:11, color:'#9ca3af', marginTop:2, display:'flex', gap:8, flexWrap:'wrap' },
  fileBadge: (color, bg) => ({
    fontSize:10, fontWeight:700, padding:'2px 6px', borderRadius:4,
    background: bg, color, flexShrink:0,
  }),
  chevron: { color:'#9ca3af', fontSize:18, flexShrink:0 },

  emptyState: {
    textAlign:'center', padding:'60px 20px', color:'#9ca3af',
    fontSize:13, lineHeight:1.8,
  },

  refreshBar: {
    padding:'8px 16px', display:'flex', justifyContent:'space-between', alignItems:'center',
    fontSize:11, color:'#9ca3af',
  },
  refreshBtn: {
    fontSize:12, color:'#1e2a4a', fontWeight:600,
    display:'flex', alignItems:'center', gap:4,
  },

  toast: {
    position:'fixed', bottom:30, left:'50%', transform:'translateX(-50%)',
    background:'#1e2a4a', color:'#fff', padding:'9px 18px',
    borderRadius:20, fontSize:12, fontWeight:600,
    boxShadow:'0 4px 12px rgba(0,0,0,.2)',
    zIndex:100,
  },
};

// ===================================
// Spinner
// ===================================
const Spinner = () => <div className="spinner" style={S.spinner} />;

// ===================================
// メインアプリ
// ===================================
function App() {
  // pathStack: [{id, name}] - 現在のフォルダ階層
  const [pathStack, setPathStack] = useState([{ id: ROOT_FOLDER_ID, name: ROOT_NAME }]);
  const [files, setFiles] = useState([]);
  const [loading, setLoading] = useState(true);
  const [error, setError] = useState(null);
  const [search, setSearch] = useState('');
  const [filter, setFilter] = useState('all');  // all | folder | pdf
  const [toast, setToast] = useState('');
  const [lastFetch, setLastFetch] = useState(null);

  // フォルダ内容を取得
  const current = pathStack[pathStack.length - 1];

  const fetchCurrent = useCallback(async (silent = false) => {
    if (!silent) setLoading(true);
    setError(null);
    try {
      const data = await listFolderContents(current.id);
      setFiles(data);
      setLastFetch(new Date());
    } catch (e) {
      setError(e.message || 'データ取得に失敗しました');
    } finally {
      setLoading(false);
    }
  }, [current.id]);

  useEffect(() => { fetchCurrent(); }, [fetchCurrent]);

  const showToast = (msg) => {
    setToast(msg);
    setTimeout(() => setToast(''), 1800);
  };

  // フィルタ＆検索
  const filtered = useMemo(() => {
    let list = files;
    if (filter === 'folder') list = list.filter(isFolder);
    else if (filter === 'pdf') list = list.filter(isPdf);
    else if (filter === 'highlight') list = list.filter(f => f.name.includes('◎'));
    else if (filter === 'reject') list = list.filter(f => f.name.includes('×'));
    if (search.trim()) {
      const q = search.trim().toLowerCase();
      list = list.filter(f => (f.name||'').toLowerCase().includes(q));
    }
    return list;
  }, [files, filter, search]);

  // フォルダ移動
  const enterFolder = (folder) => {
    setPathStack(s => [...s, { id: folder.id, name: folder.name }]);
    setSearch('');
    setFilter('all');
    window.scrollTo(0, 0);
  };

  const goBack = () => {
    if (pathStack.length <= 1) return;
    setPathStack(s => s.slice(0, -1));
    setSearch('');
    setFilter('all');
    window.scrollTo(0, 0);
  };

  const jumpTo = (idx) => {
    if (idx >= pathStack.length - 1) return;
    setPathStack(s => s.slice(0, idx + 1));
    setSearch('');
    setFilter('all');
    window.scrollTo(0, 0);
  };

  // ファイル/フォルダクリック
  const handleFileClick = (f) => {
    if (isFolder(f)) {
      enterFolder(f);
    } else {
      // PDF・その他はwebViewLinkを開く
      const url = f.webViewLink || `https://drive.google.com/file/d/${f.id}/view`;
      window.open(url, '_blank', 'noopener,noreferrer');
    }
  };

  // カウント
  const folderCount = filtered.filter(isFolder).length;
  const fileCount = filtered.length - folderCount;

  return (
    <div style={S.appBg}>
      {/* ===== Header ===== */}
      <div style={S.header}>
        <div style={S.headerRow}>
          {pathStack.length > 1 ? (
            <button style={S.iconBtn} onClick={goBack} title="戻る">←</button>
          ) : (
            <div style={{...S.iconBtn, background:'rgba(255,255,255,.08)'}}>📚</div>
          )}
          <div style={S.title}>
            <span style={S.titleText}>{current.name}</span>
          </div>
          <button style={S.iconBtn} onClick={() => fetchCurrent()} title="更新">
            <span style={loading ? { display:'inline-block' } : {}} className={loading ? 'spinner' : ''}>↻</span>
          </button>
        </div>
        <input
          style={S.searchBar}
          placeholder="🔍 ファイル名で検索"
          value={search}
          onChange={e => setSearch(e.target.value)}
        />
      </div>

      {/* ===== Breadcrumb ===== */}
      {pathStack.length > 1 && (
        <div style={S.breadcrumb}>
          {pathStack.map((p, i) => (
            <React.Fragment key={p.id}>
              {i > 0 && <span style={S.crumbSep}>/</span>}
              {i < pathStack.length - 1 ? (
                <button style={S.crumbBtn} onClick={() => jumpTo(i)}>{p.name}</button>
              ) : (
                <span style={S.crumbCurrent}>{p.name}</span>
              )}
            </React.Fragment>
          ))}
        </div>
      )}

      {/* ===== Filter Chips ===== */}
      <div style={S.filterBar}>
        <button style={S.filterChip(filter==='all')} onClick={() => setFilter('all')}>
          すべて（{files.length}）
        </button>
        <button style={S.filterChip(filter==='folder')} onClick={() => setFilter('folder')}>
          📁 フォルダ（{files.filter(isFolder).length}）
        </button>
        <button style={S.filterChip(filter==='pdf')} onClick={() => setFilter('pdf')}>
          📄 PDF（{files.filter(isPdf).length}）
        </button>
        <button style={S.filterChip(filter==='highlight')} onClick={() => setFilter('highlight')}>
          ◎ 注目
        </button>
        <button style={S.filterChip(filter==='reject')} onClick={() => setFilter('reject')}>
          × 見送
        </button>
      </div>

      {/* ===== Refresh Bar ===== */}
      {lastFetch && !loading && !error && (
        <div style={S.refreshBar}>
          <span>最終更新: {lastFetch.toLocaleTimeString('ja-JP', { hour:'2-digit', minute:'2-digit' })}</span>
          <span>{folderCount} フォルダ / {fileCount} ファイル</span>
        </div>
      )}

      {/* ===== Content ===== */}
      {loading ? (
        <div style={S.loading}>
          <Spinner />
          <div>読み込み中...</div>
        </div>
      ) : error ? (
        <div style={S.errorBox}>
          <div style={{ fontWeight:700, marginBottom:6 }}>⚠️ エラーが発生したっちゃ</div>
          <div style={{ fontSize:12, marginBottom:8 }}>{error}</div>
          <div style={{ fontSize:11, color:'#6b7280', lineHeight:1.5 }}>
            考えられる原因:<br />
            ・Googleドライブの共有設定が「リンクを知っている全員」になっとらん<br />
            ・APIキーの権限設定が間違っとる<br />
            ・ネット接続が不安定
          </div>
          <button
            style={{ marginTop:10, padding:'8px 14px', background:'#1e2a4a', color:'#fff', borderRadius:8, fontSize:12 }}
            onClick={() => fetchCurrent()}
          >再試行</button>
        </div>
      ) : filtered.length === 0 ? (
        <div style={S.emptyState}>
          {files.length === 0
            ? 'このフォルダは空っちゃ'
            : '該当するファイルなし'}
        </div>
      ) : (
        <div style={S.fileList} className="fade-in">
          {filtered.map(f => {
            const folder = isFolder(f);
            const meta = getNameColor(f.name);
            return (
              <div key={f.id}
                style={S.fileCard(meta.color, meta.bg)}
                onClick={() => handleFileClick(f)}
                onMouseEnter={(e) => e.currentTarget.style.boxShadow = '0 4px 12px rgba(30,42,74,.1), 0 0 0 1px rgba(0,0,0,.05)'}
                onMouseLeave={(e) => e.currentTarget.style.boxShadow = '0 1px 3px rgba(0,0,0,.05), 0 0 0 1px rgba(0,0,0,.03)'}
              >
                <div style={S.fileIcon}>{getFileIcon(f)}</div>
                <div style={S.fileMain}>
                  <div style={S.fileName}>{f.name}</div>
                  <div style={S.fileMeta}>
                    {!folder && f.size && <span>{formatSize(f.size)}</span>}
                    {f.modifiedTime && <span>📅 {formatDate(f.modifiedTime)}</span>}
                    {!folder && <span style={{ fontSize:10, color:'#9ca3af' }} className="mono">{f.mimeType?.split('.').pop()?.split('/').pop()?.substring(0,12)}</span>}
                  </div>
                </div>
                {meta.tag && (
                  <div style={S.fileBadge(meta.color, meta.bg)}>{meta.tag}</div>
                )}
                <div style={S.chevron}>{folder ? '›' : '↗'}</div>
              </div>
            );
          })}
        </div>
      )}

      {toast && <div style={S.toast}>{toast}</div>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
