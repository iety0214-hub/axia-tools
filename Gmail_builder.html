<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>契約・金消完了報告作成ツール</title>
    <!-- ホーム画面に置いたときアプリとして開くための一式（相対パスでGitHub Pagesに対応） -->
    <link rel="manifest" href="Gmail_builder.webmanifest">
    <meta name="theme-color" content="#1B1B26">
    <link rel="icon" href="gmail-builder/icon-192.png">
    <link rel="apple-touch-icon" sizes="180x180" href="gmail-builder/icon-180.png">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="報告メール">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #FFD700 0%, #000000 100%);
            min-height: 100vh;
            padding: 20px 20px 110px;
        }

        .container {
            max-width: 700px;
            margin: 0 auto;
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #FFD700 0%, #000000 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 28px;
            margin-bottom: 8px;
        }

        .header p {
            opacity: 0.9;
            font-size: 14px;
        }

        .form-section {
            padding: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            color: #333;
            font-size: 14px;
        }

        select, input, textarea {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            font-family: inherit;
            transition: all 0.3s ease;
        }

        select:focus, input:focus, textarea:focus {
            outline: none;
            border-color: #FFD700;
            box-shadow: 0 0 0 3px rgba(255, 215, 0, 0.1);
        }

        /* 必須項目は項目名そのものを赤字にする */
        .required {
            color: #ef4444;
        }

        /* 画面下に固定する送信バー */
        .action-bar {
            position: fixed;
            left: 0;
            right: 0;
            bottom: 0;
            padding: 12px 16px;
            padding-bottom: calc(12px + env(safe-area-inset-bottom));
            background: rgba(255, 255, 255, 0.97);
            border-top: 1px solid #e0e0e0;
            box-shadow: 0 -4px 20px rgba(0, 0, 0, 0.12);
            z-index: 500;
        }

        .action-bar-inner {
            max-width: 700px;
            margin: 0 auto;
        }

        .action-bar .btn-gmail {
            width: 100%;
            padding: 16px;
            font-size: 17px;
        }

        /* ラベルと編集ボタンを1行に */
        .label-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            margin-bottom: 8px;
        }

        .label-row label {
            margin-bottom: 0;
        }

        .btn-gear {
            background: none;
            border: none;
            color: #667eea;
            font-size: 12px;
            font-weight: 600;
            padding: 4px 6px;
            cursor: pointer;
            flex-shrink: 0;
        }

        .btn-gear:hover {
            text-decoration: underline;
        }

        /* 未入力のその場表示 */
        .error-msg {
            display: none;
            color: #ef4444;
            font-size: 12px;
            font-weight: 600;
            margin-top: 6px;
        }

        .field-error .error-msg {
            display: block;
        }

        .field-error select,
        .field-error input,
        .field-error textarea {
            border-color: #ef4444;
            background: #fff5f5;
        }

        .preview-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            margin-bottom: 15px;
        }

        button {
            padding: 14px 24px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-gmail {
            background: #EA4335;
            color: white;
        }

        .btn-gmail:hover {
            background: #d33426;
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(234, 67, 53, 0.4);
        }

        .preview-section {
            background: #f8f9fa;
            padding: 30px;
            border-top: 2px solid #e0e0e0;
            display: none;
        }

        .preview-section.active {
            display: block;
        }

        .preview-box {
            background: white;
            padding: 24px;
            border-radius: 8px;
            border: 2px solid #e0e0e0;
            white-space: pre-wrap;
            font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic UI", "Meiryo UI", sans-serif;
            font-size: 14px;
            line-height: 1.8;
            max-height: 500px;
            overflow-y: auto;
            font-weight: 600;
            color: #000;
        }

        .toast {
            position: fixed;
            top: 20px;
            right: 20px;
            background: #10b981;
            color: white;
            padding: 16px 24px;
            border-radius: 8px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
            display: none;
            animation: slideIn 0.3s ease;
            z-index: 1000;
        }

        .toast.active {
            display: block;
        }

        @keyframes slideIn {
            from {
                transform: translateX(400px);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        .info-text {
            font-size: 12px;
            color: #666;
            margin-top: 4px;
        }

        .btn-mini {
            background: #667eea;
            color: #fff;
            padding: 8px 14px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 13px;
        }

        .btn-mini.secondary {
            background: #e0e0e0;
            color: #333;
        }

        .save-row {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 10px;
            font-size: 13px;
            color: #333;
        }

        .save-row input[type="checkbox"] {
            width: 18px;
            height: 18px;
            accent-color: #667eea;
            flex-shrink: 0;
        }

        .modal-backdrop {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            display: none;
            align-items: center;
            justify-content: center;
            padding: 16px;
            z-index: 1000;
        }

        .modal-backdrop.active {
            display: flex;
        }

        .modal {
            background: #fff;
            border-radius: 12px;
            width: 100%;
            max-width: 440px;
            max-height: 80vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .modal-head {
            padding: 16px;
            border-bottom: 1px solid #eee;
            font-weight: 700;
            color: #333;
        }

        .modal-body {
            padding: 16px;
            overflow-y: auto;
        }

        .modal-foot {
            padding: 12px 16px;
            border-top: 1px solid #eee;
            text-align: right;
        }

        .modal-add {
            display: flex;
            gap: 8px;
            margin-bottom: 14px;
        }

        .modal-add input {
            flex: 1;
            min-width: 0;
            padding: 10px 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
        }

        .list-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            padding: 10px 4px;
            border-bottom: 1px solid #f0f0f0;
            font-size: 14px;
            color: #333;
        }

        .add-row-group {
            margin-top: -12px;
        }

        /* 行を追加する小さなボタン */
        .btn-add-row {
            padding: 6px 12px;
            margin-top: 8px;
            background: #f2f4ff;
            border: 1px solid #c7cdf5;
            color: #667eea;
            border-radius: 999px;
            font-size: 12px;
            font-weight: 600;
        }

        .btn-add-row:hover {
            background: #e6e9fb;
        }

        .btn-row-del {
            background: none;
            border: none;
            color: #ef4444;
            font-size: 12px;
            font-weight: 600;
            padding: 4px 6px;
            cursor: pointer;
            flex-shrink: 0;
        }

        .sub-input {
            margin-top: 8px;
        }

        .btn-del {
            background: #ef4444;
            color: #fff;
            border: none;
            border-radius: 6px;
            padding: 6px 12px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            flex-shrink: 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📧 契約・金消完了報告メール</h1>
            <p>赤い項目は必ず入力してください</p>
        </div>

        <div class="form-section">
            <div class="form-group">
                <label class="required">送信先</label>
                <input type="text" id="sendTo" value="axia-japan@googlegroups.com" readonly style="background: #f0f0f0;">
            </div>

            <div class="form-group">
                <label class="required">種別</label>
                <select id="reportType">
                    <option value="">選択してください</option>
                    <option value="事前承認">事前承認</option>
                    <option value="本承認">本承認</option>
                    <option value="申込">申込</option>
                    <option value="契約">契約</option>
                    <option value="電話面談">電話面談</option>
                    <option value="金消">金消</option>
                    <option value="物件振替">物件振替</option>
                    <option value="物件確定">物件確定</option>
                    <option value="オープン">オープン</option>
                </select>
            </div>

            <div class="form-group">
                <label class="required">区分</label>
                <select id="category">
                    <option value="">選択してください</option>
                    <option value="新規">新規</option>
                    <option value="買増">買増</option>
                    <option value="他社増し">他社増し</option>
                </select>
            </div>

            <div class="form-group">
                <label class="required">顧客名</label>
                <input type="text" id="customerName" placeholder="例：田口 航太様">
                <div class="info-text">「様」は自動で追加されます</div>
            </div>

            <div class="form-group" id="beforePropertyGroup" style="display: none;">
                <label class="required">振替前物件名</label>
                <select id="beforePropertyName">
                    <option value="">選択してください</option>
                </select>
            </div>

            <div class="form-group" id="customBeforePropertyGroup" style="display: none;">
                <label>振替前物件名（手入力）</label>
                <input type="text" id="customBeforeProperty" placeholder="物件名を入力してください">
            </div>

            <div class="form-group" id="beforeRoomGroup" style="display: none;">
                <label>振替前号室</label>
                <input type="text" id="beforeRoomNumber" placeholder="例：203号室">
            </div>

            <div class="form-group">
                <div class="label-row">
                    <label class="required" for="propertyName">物件名</label>
                    <button type="button" class="btn-gear" data-edit-list="property">⚙ 物件リスト</button>
                </div>
                <select id="propertyName" class="js-property-select">
                    <option value="">選択してください</option>
                </select>
            </div>

            <div class="form-group" id="customPropertyGroup" style="display: none;">
                <label>物件名（手入力）</label>
                <input type="text" id="customProperty" placeholder="物件名を入力してください">
                <div class="save-row">
                    <input type="checkbox" id="savePropertyToList">
                    <label for="savePropertyToList" style="margin: 0; font-weight: 500;">この物件名をリストに追加する</label>
                </div>
            </div>

            <div class="form-group">
                <label>号室</label>
                <input type="text" id="roomNumber" placeholder="例：203号室">
            </div>

            <div id="extraProperties"></div>

            <div class="form-group add-row-group">
                <button type="button" class="btn-add-row" id="btnAddProperty">＋ 物件</button>
            </div>

            <div class="form-group">
                <div class="label-row">
                    <label class="required" for="bank">銀行</label>
                    <button type="button" class="btn-gear" data-edit-list="bank">⚙ 銀行リスト</button>
                </div>
                <select id="bank">
                    <option value="">選択してください</option>
                </select>
            </div>

            <div class="form-group" id="customBankGroup" style="display: none;">
                <label>銀行名（手入力）</label>
                <input type="text" id="customBank" placeholder="銀行名を入力してください">
                <div class="save-row">
                    <input type="checkbox" id="saveBankToList">
                    <label for="saveBankToList" style="margin: 0; font-weight: 500;">この銀行名をリストに追加する</label>
                </div>
            </div>

            <div class="form-group">
                <label>契約</label>
                <input type="date" id="contractDate">
            </div>

            <div class="form-group">
                <label>決済予定</label>
                <input type="date" id="settlementDate">
            </div>

            <div class="form-group">
                <div class="label-row">
                    <label class="required" for="personInCharge">担当</label>
                    <button type="button" class="btn-gear" data-edit-list="staff">⚙ 社員リスト</button>
                </div>
                <select id="personInCharge">
                    <option value="">選択してください</option>
                </select>
            </div>

            <div class="form-group">
                <label for="accompany">同行</label>
                <select id="accompany" class="js-accompany-select">
                    <option value="">選択してください</option>
                </select>
            </div>

            <div id="extraAccompany"></div>

            <div class="form-group add-row-group">
                <button type="button" class="btn-add-row" id="btnAddAccompany">＋ 同行者</button>
            </div>

            <div class="form-group">
                <div class="label-row">
                    <label for="department">所属</label>
                    <button type="button" class="btn-gear" data-edit-list="department">⚙ 所属リスト</button>
                </div>
                <select id="department">
                    <option value="">選択してください</option>
                </select>
            </div>

            <div class="form-group">
                <label>備考</label>
                <textarea id="remarks" rows="3" placeholder="例：2物件同時、決済日変更予定など" style="width: 100%; padding: 12px 16px; border: 2px solid #e0e0e0; border-radius: 8px; font-size: 14px; font-family: inherit; resize: vertical;"></textarea>
            </div>

            <!-- 件名プレビュー（非表示・JavaScript用） -->
            <input type="hidden" id="subjectPreview">
        </div>

        <div class="preview-section" id="previewSection">
            <div class="preview-head">
                <h3 style="color: #333;">📋 プレビュー</h3>
                <button type="button" class="btn-mini secondary" id="btnCopy">コピー</button>
            </div>
            <div class="preview-box" id="previewBox"></div>
        </div>
    </div>

    <div class="action-bar">
        <div class="action-bar-inner">
            <button class="btn-gmail" type="button" id="btnGmail">Gmail送信</button>
        </div>
    </div>

    <div class="modal-backdrop" id="listModal">
        <div class="modal">
            <div class="modal-head" id="listModalTitle">リストを編集</div>
            <div class="modal-body">
                <div class="modal-add">
                    <input type="text" id="listModalInput" placeholder="追加する項目を入力">
                    <button type="button" class="btn-mini" id="listModalAdd">追加</button>
                </div>
                <div id="listModalItems"></div>
            </div>
            <div class="modal-foot">
                <button type="button" class="btn-mini secondary" id="listModalClose">閉じる</button>
            </div>
        </div>
    </div>

    <div class="toast" id="toast">コピーしました！</div>

    <script>
        // ========== マスターリスト（初期値） ==========
        const DEFAULT_PROPERTIES = [
            'AXIA M-City大阪加賀屋',
            'AXIA CITY神戸松原',
            'AXIA CITY武蔵小山',
            'AXIA CITY大阪瑞光',
            'AXIA CITY浮間舟渡',
            'AXIA CITY 下井草全',
            'AXIA CITY 亀有'
        ];

        // 旧バージョンの初期値（自分で追加した物件だけを引き継ぐために使う）
        const OLD_DEFAULT_PROPERTIES = [
            'ライジングプレイス綾瀬',
            'プレサンスジェネ千種内山2',
            'MAXIV代田橋',
            'AXIA City 大阪淡路',
            'デュオステージ調布国領MAXIV',
            'AXIA M-City大阪加賀屋',
            'MAXIV板橋本町',
            'ラナップスクエア新福島',
            'プレール・ドゥーク田園調布南',
            'MAXIV百合ヶ丘',
            'MAXIV新栄',
            'AXIA CITY神戸松原',
            'AXIA CITY武蔵小山',
            'AXIA CITY大阪瑞光',
            'AXIA CITY浮間舟渡',
            'AXIA CITY 下井草全',
            'AXIA CITY 亀有'
        ];

        const DEFAULT_BANKS = [
            '楽天銀行',
            'SBJ銀行',
            'イオン住宅ローンサービス',
            'SBI新生アセットファイナンス'
        ];

        // 名称が変わった銀行（保存済みのリストも読み替える）
        const BANK_RENAMES = {
            'イオン銀行': 'イオン住宅ローンサービス',
            'SBI新生銀行': 'SBI新生アセットファイナンス'
        };

        const DEFAULT_STAFF = [
            '茂木社長', '井上常務', '笠原部長', '土屋次長', '家原部長',
            '伊藤係長', '川合部長', '安部課長', '髙野係長', '佐野係長',
            '浅見主任', '坪井社員', '桃井主任', '五十嵐主任', '三浦社員',
            '儀間主任', '脇田主任', '内田社員', '瓜田社員', '柴田社員',
            '木村社員', '後藤社員', '糸永社員', '堀社員'
        ];

        const DEFAULT_DEPARTMENTS = [
            '笠原課', '土屋課', '安部課', '高野課', '佐野課', '儀間課'
        ];

        const LIST_DEFS = {
            property: { key: 'propertyList_v3', label: '物件リスト', placeholder: '物件名を入力', defaults: DEFAULT_PROPERTIES, render: renderPropertySelects },
            bank:     { key: 'bankList_v3',     label: '銀行リスト', placeholder: '銀行名を入力', defaults: DEFAULT_BANKS,      render: renderBankSelect },
            staff:    { key: 'staffList_v2',    label: '社員リスト', placeholder: '社員名を入力', defaults: DEFAULT_STAFF,      render: renderStaffSelects },
            department: { key: 'departmentList_v2', label: '所属リスト', placeholder: '所属を入力', defaults: DEFAULT_DEPARTMENTS, render: renderDepartmentSelect }
        };

        // 旧バージョンのリストを引き継ぐ
        function migrateOldStorage() {
            try {
                migrateProperties();
                migrateBanks();
            } catch (e) {
                console.error('リスト移行エラー:', e);
            }
        }

        // 物件：初期値は新しいものに入れ替え、自分で追加した分だけ残す
        function migrateProperties() {
            if (localStorage.getItem(LIST_DEFS.property.key)) return;

            let inherited = null;
            const saved = localStorage.getItem('propertyList_v2');
            if (saved) {
                inherited = JSON.parse(saved);
            } else {
                const oldest = localStorage.getItem('customProperties');
                if (oldest) inherited = JSON.parse(oldest);
            }
            if (!Array.isArray(inherited) || inherited.length === 0) return;

            const merged = DEFAULT_PROPERTIES.slice();
            inherited.forEach(function(name) {
                if (OLD_DEFAULT_PROPERTIES.indexOf(name) !== -1) return;
                if (merged.indexOf(name) === -1) merged.push(name);
            });
            localStorage.setItem(LIST_DEFS.property.key, JSON.stringify(merged));
        }

        // 銀行：改称した名前に読み替えて引き継ぐ
        function migrateBanks() {
            if (localStorage.getItem(LIST_DEFS.bank.key)) return;

            const saved = localStorage.getItem('bankList_v2');
            if (!saved) return;

            const oldArray = JSON.parse(saved);
            if (!Array.isArray(oldArray) || oldArray.length === 0) return;

            const renamed = [];
            oldArray.forEach(function(name) {
                const fixed = BANK_RENAMES[name] || name;
                if (renamed.indexOf(fixed) === -1) renamed.push(fixed);
            });
            localStorage.setItem(LIST_DEFS.bank.key, JSON.stringify(renamed));
        }

        // リスト取得（保存が無ければ初期値）
        function getList(type) {
            const def = LIST_DEFS[type];
            try {
                const saved = localStorage.getItem(def.key);
                if (saved) {
                    const arr = JSON.parse(saved);
                    if (Array.isArray(arr) && arr.length > 0) return arr;
                }
            } catch (e) {
                console.error('リスト読み込みエラー:', e);
            }
            return def.defaults.slice();
        }

        // リスト保存＋ドロップダウン再描画
        function setList(type, arr) {
            const def = LIST_DEFS[type];
            try {
                localStorage.setItem(def.key, JSON.stringify(arr));
            } catch (e) {
                console.error('リスト保存エラー:', e);
            }
            def.render();
        }

        // リストに1件追加（既存なら false）
        function addToList(type, name) {
            const arr = getList(type);
            if (arr.indexOf(name) !== -1) return false;
            arr.push(name);
            setList(type, arr);
            return true;
        }

        // セレクトを組み立て直す（選択中の値はできるだけ維持）
        function fillSelect(selectId, items, options) {
            fillSelectEl(document.getElementById(selectId), items, options);
        }

        function fillSelectEl(select, items, options) {
            if (!select) return;
            const current = select.value;
            const opts = options || {};

            select.innerHTML = '';
            const placeholder = document.createElement('option');
            placeholder.value = '';
            placeholder.textContent = '選択してください';
            select.appendChild(placeholder);

            if (opts.undecided) {
                const undecided = document.createElement('option');
                undecided.value = '未定';
                undecided.textContent = '未定';
                select.appendChild(undecided);
            }

            items.forEach(function(name) {
                const option = document.createElement('option');
                option.value = name;
                option.textContent = name;
                select.appendChild(option);
            });

            if (opts.custom) {
                const other = document.createElement('option');
                other.value = 'その他';
                other.textContent = '✏️ その他（手入力）';
                select.appendChild(other);
            }

            select.value = current;
            if (select.value !== current) select.value = '';
        }

        function renderPropertySelects() {
            const items = getList('property');
            Array.prototype.forEach.call(document.querySelectorAll('.js-property-select'), function(select) {
                fillSelectEl(select, items, { undecided: true, custom: true });
            });
            fillSelect('beforePropertyName', items, { undecided: true, custom: true });

        function renumberPropertyRows() {
            Array.prototype.forEach.call(document.querySelectorAll('.extra-property'), function(row, i) {
                row.querySelector('label').textContent = '物件名（' + (i + 2) + '件目）';
            });

        // 入力されている物件を上から順に集める（失敗時は null）
        function collectProperties(report) {
            const list = [];

            const first = document.getElementById('propertyName').value;
            const firstCustom = document.getElementById('customProperty').value.trim();
            const firstRoom = document.getElementById('roomNumber').value.trim();

            if (report) {
                if (!first) {
                    showFieldError('propertyName', '物件名を選んでください');
                    return null;
                }
                if (first === 'その他' && !firstCustom) {
                    showFieldError('customProperty', '物件名を入力してください');
                    return null;
                }
            }

            if (first) {
                list.push({ name: first === 'その他' ? firstCustom : first, room: firstRoom });
            }

            const rows = document.querySelectorAll('.extra-property');
            for (let i = 0; i < rows.length; i++) {
                const row = rows[i];
                const select = row.querySelector('.extra-prop-select');
                const custom = row.querySelector('.extra-prop-custom').value.trim();
                const room = row.querySelector('.extra-prop-room').value.trim();

                if (!select.value || (select.value === 'その他' && !custom)) {
                    if (report) {
                        showRowError(row, select, (i + 2) + '件目の物件名を入力してください');
                        return null;
                    }
                    continue;
                }
                list.push({ name: select.value === 'その他' ? custom : select.value, room: room });
            }

            return list;
        }

                focusEl.focus();
            }

        // 物件を1行の文字列にする（1件のときは号室を別行に出すので名前だけ）
        function formatProperties(list) {

                } catch (err) {
                    console.error('選択の保存エラー:', err);

            });

        function saveCustomEntryIfRequested(listType, selectId, inputId, groupId, checkboxId) {
            const select = document.getElementById(selectId);
            const checkbox = document.getElementById(checkboxId);

            if (select.value !== 'その他' || !checkbox.checked) return;

            const name = document.getElementById(inputId).value.trim();

            const added = addToList(listType, name);

            document.getElementById(groupId).style.display = 'none';

            checkbox.checked = false;

            if (added) {
                showToast('「' + name + '」をリストに追加しました', 'success');
            }
        }

        // 生成処理（成功=true／未入力=false）
        function generateReport() {
            clearFieldErrors();

            const reportType = document.getElementById('reportType').value;
            const category = document.getElementById('category').value;
            const customerName = document.getElementById('customerName').value.trim();
            const beforePropertyName = document.getElementById('beforePropertyName').value;
            const customBeforeProperty = document.getElementById('customBeforeProperty').value.trim();
            const beforeRoomNumber = document.getElementById('beforeRoomNumber').value.trim();
            const propertyName = document.getElementById('propertyName').value;
            const customProperty = document.getElementById('customProperty').value.trim();
            const roomNumber = document.getElementById('roomNumber').value.trim();
            const bank = document.getElementById('bank').value;
            const customBank = document.getElementById('customBank').value.trim();
            const contractDate = document.getElementById('contractDate').value;
            const settlementDate = document.getElementById('settlementDate').value;
            const personInCharge = document.getElementById('personInCharge').value;
            const accompanyList = collectAccompany();
            const department = document.getElementById('department').value;
            const remarks = document.getElementById('remarks').value.trim();
            const subject = document.getElementById('subjectPreview').value;

            // 必須チェック
            if (!reportType) {
                return showFieldError('reportType', '種別を選んでください');
            }
            if (!category) {
                return showFieldError('category', '区分を選んでください');
            }
            if (!customerName) {
                return showFieldError('customerName', '顧客名を入力してください');
            }
            
            // 物件振替の場合は振替前物件名もチェック
            if (reportType === '物件振替') {
                if (!beforePropertyName) {
                    return showFieldError('beforePropertyName', '振替前の物件名を選んでください');
                }
                if (beforePropertyName === 'その他' && !customBeforeProperty) {
                    return showFieldError('customBeforeProperty', '振替前の物件名を入力してください');
                }
            }
            
            const properties = collectProperties(true);
            if (!properties) {
                return false;
            }
            if (!bank) {
                return showFieldError('bank', '銀行を選んでください');
            }
            if (bank === 'その他' && !customBank) {
                return showFieldError('customBank', '銀行名を入力してください');
            }
            if (!personInCharge) {
                return showFieldError('personInCharge', '担当を選んでください');
            }

            // 値の確定
            const finalBeforePropertyName = beforePropertyName === 'その他' ? customBeforeProperty : beforePropertyName;
            const finalBank = bank === 'その他' ? customBank : bank;
            const finalCustomerName = customerName.endsWith('様') ? customerName : customerName + '様';

            // 日付フォーマット（月・日・曜日のみ）
            let formattedContractDate = '';
            if (contractDate) {
                const date = new Date(contractDate);
                const month = date.getMonth() + 1;
                const day = date.getDate();
                const weekdays = ['日', '月', '火', '水', '木', '金', '土'];
                const weekday = weekdays[date.getDay()];
                formattedContractDate = month + '月' + day + '日（' + weekday + '）';
            }

            let formattedSettlementDate = '';
            if (settlementDate) {
                const date = new Date(settlementDate);
                const month = date.getMonth() + 1;
                const day = date.getDate();
                const weekdays = ['日', '月', '火', '水', '木', '金', '土'];
                const weekday = weekdays[date.getDay()];
                formattedSettlementDate = month + '月' + day + '日（' + weekday + '）';
            }

            // メール本文生成（シンプル版）
            let report = '【種別】' + reportType + '\n';
            report += '【区分】' + category + '\n';
            report += '【顧客名】' + finalCustomerName + '\n';
            
            // 物件振替の場合は振替前を追加（物件名 + 号室）
            if (reportType === '物件振替' && finalBeforePropertyName) {
                let beforeInfo = finalBeforePropertyName;
                if (beforeRoomNumber) {
                    beforeInfo += ' ' + beforeRoomNumber;
                }
                report += '【振替前】' + beforeInfo + '\n';
            }
            
            // 1件なら今まで通り物件名と号室を分けて、2件以上なら【物件名】に「物件名 号室」でまとめる
            if (properties.length === 1) {
                report += '【物件名】' + properties[0].name + '\n';
                report += '【号室】' + (roomNumber || '－') + '\n';
            } else {
                report += '【物件名】' + formatProperties(properties) + '\n';
            }
            report += '【銀行】' + finalBank + '\n';
            report += '【契約】' + (formattedContractDate || '－') + '\n';
            report += '【決済予定】' + (formattedSettlementDate || '－') + '\n';
            report += '【担当】' + (personInCharge || '－') + '\n';
            report += '【同行】' + (accompanyList.length ? accompanyList.join('、') : '－') + '\n';
            report += '【所属】' + (department || '－');
            
            // 備考欄がある場合のみ追加
            if (remarks) {
                report += '\n【備考】' + remarks;
            }

            document.getElementById('previewBox').textContent = report;
            document.getElementById('previewSection').classList.add('active');
            document.getElementById('previewSection').scrollIntoView({ behavior: 'smooth' });

            // 手入力した内容を、チェックが入っていればリストへ保存
            saveCustomEntryIfRequested('property', 'propertyName', 'customProperty', 'customPropertyGroup', 'savePropertyToList');
            saveCustomEntryIfRequested('bank', 'bank', 'customBank', 'customBankGroup', 'saveBankToList');

            updateSubject();

            return true;
        }

        // コピーボタン
        document.getElementById('btnCopy').addEventListener('click', function() {
            const previewBox = document.getElementById('previewBox');
            const text = previewBox.textContent;
            
            if (!text || text.trim() === '') {
                showToast('先に「Gmail送信」を押してください', 'error');
                return;
            }
            
            // テキストエリアを使った確実なコピー方法
            const textarea = document.createElement('textarea');
            textarea.value = text;
            textarea.style.position = 'fixed';
            textarea.style.top = '0';
            textarea.style.left = '0';
            textarea.style.width = '2em';
            textarea.style.height = '2em';
            textarea.style.padding = '0';
            textarea.style.border = 'none';
            textarea.style.outline = 'none';
            textarea.style.boxShadow = 'none';
            textarea.style.background = 'transparent';
            document.body.appendChild(textarea);
            textarea.focus();
            textarea.select();
            
            try {
                const successful = document.execCommand('copy');
                if (successful) {
                    showToast('コピーしました！', 'success');
                } else {
                    showToast('コピーに失敗しました。プレビューを長押ししてコピーしてください。', 'error');
                }
            } catch (err) {
                console.error('コピーエラー:', err);
                showToast('コピーに失敗しました。プレビューを長押ししてコピーしてください。', 'error');
            }
            
            document.body.removeChild(textarea);
        });

        // クリップボードへコピー（トースト表示なし・保険用）
        function copyToClipboard(text) {
            try {
                const ta = document.createElement('textarea');
                ta.value = text;
                ta.style.position = 'fixed';
                ta.style.top = '0';
                ta.style.left = '0';
                ta.style.width = '2em';
                ta.style.height = '2em';
                ta.style.padding = '0';
                ta.style.border = 'none';
                ta.style.outline = 'none';
                ta.style.boxShadow = 'none';
                ta.style.background = 'transparent';
                document.body.appendChild(ta);
                ta.focus();
                ta.select();
                const ok = document.execCommand('copy');
                document.body.removeChild(ta);
                return ok;
            } catch (err) {
                console.error('コピーエラー:', err);
                return false;
            }
        }

        function showToast(message, type) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            
            if (type === 'error') {
                toast.style.background = '#ef4444';
            } else {
                toast.style.background = '#10b981';
            }
            
            toast.classList.add('active');
            setTimeout(function() {
                toast.classList.remove('active');
            }, 3000);
        }

        // iPhone / iPad かどうか（iPadOSはUserAgentがMacintoshになる）
        function isIOSDevice() {
            const ua = navigator.userAgent;
            if (/iPhone|iPad|iPod/i.test(ua)) return true;
            return /Macintosh/.test(ua) && navigator.maxTouchPoints > 1;
        }

        function isAndroidDevice() {
            return /Android/i.test(navigator.userAgent);
        }

        // アプリ用のURLを開き、アプリが立ち上がらなければ指定のURLへ切り替える
        function openAppThenFallback(appUrl, fallbackUrl) {
            let left = false;
            const onHide = function() { if (document.hidden) left = true; };
            document.addEventListener('visibilitychange', onHide);
            window.addEventListener('pagehide', function() { left = true; });

            window.location.href = appUrl;

            setTimeout(function() {
                document.removeEventListener('visibilitychange', onHide);
                if (!left && !document.hidden) {
                    window.location.href = fallbackUrl;
                }
            }, 1500);
        }

        // Gmail送信ボタン（生成 → コピー → Gmail起動 を一括）
        document.getElementById('btnGmail').addEventListener('click', function() {
            // 1) まず生成（未入力があればここで中断）
            if (!generateReport()) {
                return;
            }

            updateSubject();

            const emailBody = document.getElementById('previewBox').textContent;
            const subject = document.getElementById('subjectPreview').value;

            if (!subject || subject.trim() === '') {
                showToast('件名を作れませんでした。種別を選び直してください', 'error');
                return;
            }

            // 2) 本文をクリップボードへコピー
            const copied = copyToClipboard(emailBody);

            const TO = 'axia-japan@googlegroups.com';
            const encodedSubject = encodeURIComponent(subject);
            const encodedBody = encodeURIComponent(emailBody);
            const gmailWebUrl = 'https://mail.google.com/mail/?view=cm&fs=1&to=' + encodeURIComponent(TO) +
                '&su=' + encodedSubject + '&body=' + encodedBody;

            // GmailのWeb版を開く（Androidでは端末のGmailアプリがこのURLを拾う）
            function openGmailWeb() {
                const win = window.open(gmailWebUrl, '_blank');
                if (!win) window.location.href = gmailWebUrl;
            }

            // 3) Gmailを開く
            if (isIOSDevice()) {
                // googlegmail:// はiOS専用のスキーム。
                // これを使わないと既定メール（iCloud）が開いてしまう。
                const gmailAppUrl = 'googlegmail:///co?to=' + encodeURIComponent(TO) +
                    '&subject=' + encodedSubject + '&body=' + encodedBody;
                openAppThenFallback(gmailAppUrl, gmailWebUrl);

            } else if (isAndroidDevice()) {
                // Androidは mailto: で既定のメールアプリ（通常はGmail）が開く。
                // 件名だけでなく本文も渡すことで、開いた時点で全部入った状態になる。
                const mailtoUrl = 'mailto:' + TO +
                    '?subject=' + encodedSubject + '&body=' + encodedBody;
                openAppThenFallback(mailtoUrl, gmailWebUrl);

            } else {
                openGmailWeb();
            }

            showToast(copied ? '生成＋コピー完了。Gmailを開きます' : '生成完了。Gmailを開きます', 'success');
        });
    </script>
</body>
</html>
