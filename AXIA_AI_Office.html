<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>AXIA AI社員オフィス 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700;800&family=Zen+Maru+Gothic:wght@400;500;700&family=DM+Mono:wght@400&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
<style>
  :root{ --ink:#2b2440; --ink-soft:#6b6280; --gold:#e8a33d; --gold-dark:#c47f1f; --paper:#fffdf8; }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Zen Maru Gothic','M PLUS Rounded 1c',sans-serif;
    background:linear-gradient(180deg,#fdf1da 0%, #f3e6cd 100%);
    color:var(--ink); min-height:100vh; -webkit-font-smoothing:antialiased;
  }
  ::-webkit-scrollbar{display:none;}
  .chrome{max-width:100%; margin:0 auto; padding:10px 14px 18px;}

  .hud{
    background:var(--ink); border-radius:18px 18px 8px 8px; padding:14px 20px;
    display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px;
    box-shadow:0 6px 0 rgba(0,0,0,0.15); position:relative;
  }
  .hud:after{content:'';position:absolute;left:18px;right:18px;bottom:-6px;height:6px;background:var(--gold);border-radius:0 0 6px 6px;}
  .hud h1{font-family:'M PLUS Rounded 1c',sans-serif; font-weight:800; font-size:18px; color:#fff; margin:0;}
  .hud .sub{color:#c9c0e0; font-size:10.5px; margin-top:2px;}
  .hud-left{display:flex; align-items:center; gap:10px;}
  .hud-chips{display:flex; gap:6px; flex-wrap:wrap;}
  .hud-chip{font-size:11px; font-weight:700; padding:6px 11px; border-radius:999px;
    background:rgba(255,255,255,0.1); color:#fff; display:flex; align-items:center; gap:5px;}
  .hud-chip b{font-family:'DM Mono',monospace; font-weight:400;}
  .dot{width:7px;height:7px;border-radius:50%; display:inline-block;}

  .main-layout{display:flex; gap:16px; margin-top:14px; align-items:flex-start;}
  .stage-wrap{flex:1; min-width:0;}
  .side-col{width:310px; flex-shrink:0; display:flex; flex-direction:column; gap:14px;}
  @media (max-width:920px){
    .main-layout{flex-direction:column;}
    .side-col{width:100%;}
    .stage-wrap{width:100%; flex:none;}
    #stage{height:60vh; max-height:560px;}
  }

  #stage{
    position:relative; width:100%; height:calc(100vh - 150px); min-height:420px;
    border-radius:16px; overflow:hidden;
    background:linear-gradient(180deg,#fffaf0,#f0e5cf);
    box-shadow:inset 0 0 0 3px rgba(43,36,64,0.1), 0 6px 0 rgba(43,36,64,0.1);
    touch-action:none;
  }
  #stage canvas{display:block; width:100%; height:100%;}
  .label-layer{position:absolute; inset:0; pointer-events:none; overflow:hidden;}

  .tag{
    background:var(--ink); color:#fff; font-size:10.5px; font-weight:800;
    font-family:'M PLUS Rounded 1c',sans-serif;
    padding:3px 9px; border-radius:999px; white-space:nowrap;
    display:flex; align-items:center; gap:4px;
    box-shadow:0 2px 5px rgba(0,0,0,0.22);
  }
  .tag.selected{background:var(--gold); color:#2b2440;}
  .tag .pip{width:6px;height:6px;border-radius:50%;}
  .tag.vacant{background:rgba(255,255,255,.9); color:var(--ink-soft); box-shadow:0 2px 5px rgba(0,0,0,.12);}
  .tag.zone{background:rgba(255,255,255,.92); color:var(--ink-soft); font-size:10px;}

  .bub{
    background:#fff; color:var(--ink); border-radius:11px; padding:5px 10px;
    font-size:10.5px; font-weight:500; white-space:nowrap;
    max-width:170px; overflow:hidden; text-overflow:ellipsis;
    box-shadow:0 3px 8px rgba(43,36,64,0.22); position:relative;
  }
  .bub:after{content:''; position:absolute; top:100%; left:50%; transform:translateX(-50%);
    border:5px solid transparent; border-top-color:#fff;}

  .hint{
    position:absolute; left:12px; bottom:10px; z-index:3;
    font-size:10px; font-weight:700; color:var(--ink-soft);
    background:rgba(255,255,255,0.85); padding:5px 10px; border-radius:999px;
    box-shadow:0 2px 5px rgba(43,36,64,0.1);
  }
  #stage:fullscreen{
    height:100vh; width:100vw; border-radius:0; padding:0;
    background:linear-gradient(180deg,#fffaf0,#f0e5cf);
  }
  #stage:fullscreen canvas{border-radius:0;}
  .cam-btns{position:absolute; right:12px; top:12px; z-index:3; display:flex; gap:6px;}
  .cam-btn{
    border:none; background:rgba(255,255,255,0.9); color:var(--ink);
    font-family:'M PLUS Rounded 1c',sans-serif; font-weight:800; font-size:10.5px;
    padding:6px 10px; border-radius:999px; cursor:pointer;
    box-shadow:0 2px 5px rgba(43,36,64,0.15);
  }
  .cam-btn.on{background:var(--gold); color:#2b2440;}
  .loading{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    font-size:12px; font-weight:700; color:var(--ink-soft); z-index:4;
    background:linear-gradient(180deg,#fffaf0,#f0e5cf);
  }

  .panel{background:var(--paper); border-radius:14px; padding:14px 16px; box-shadow:0 4px 0 rgba(43,36,64,0.08);}
  .panel h2{font-family:'M PLUS Rounded 1c',sans-serif; font-size:13px; font-weight:800; margin:0 0 10px; display:flex; align-items:center; gap:6px;}
  .log-list{display:flex; flex-direction:column; gap:7px; max-height:240px; overflow-y:auto;}
  .log-item{font-size:11px; color:var(--ink-soft); line-height:1.5; border-left:3px solid var(--gold); padding-left:8px;}
  .log-time{font-family:'DM Mono',monospace; font-size:9.5px; color:#a89ec4; margin-right:4px;}
  .log-empty{font-size:11px; color:var(--ink-soft); opacity:.7;}
  .rule{font-size:10.5px; color:var(--ink-soft); line-height:1.7;}
  .rule b{color:var(--ink);}

  .throne{background:linear-gradient(160deg,#2b2440,#3a3158); border-radius:14px; padding:16px; color:#fff; box-shadow:0 4px 0 rgba(0,0,0,0.2);}
  .throne h2{font-family:'M PLUS Rounded 1c',sans-serif; font-size:13px; font-weight:800; margin:0 0 8px; color:#fff;}
  .throne .desc{font-size:10.5px; color:#c9c0e0; margin-bottom:12px; line-height:1.5;}
  .throne select, .throne input{
    width:100%; border:none; border-radius:9px; padding:9px 10px; font-size:12.5px;
    font-family:'Zen Maru Gothic',sans-serif; margin-bottom:8px; outline:none;
    background:rgba(255,255,255,0.92); color:var(--ink);
  }
  .throne button{
    width:100%; border:none; border-radius:9px; padding:10px; font-size:12.5px; font-weight:800;
    font-family:'M PLUS Rounded 1c',sans-serif; cursor:pointer;
    background:var(--gold); color:#2b2440; box-shadow:0 3px 0 var(--gold-dark);
  }
  .throne button:active{transform:translateY(2px); box-shadow:0 1px 0 var(--gold-dark);}
  .throne button:disabled{opacity:.5;}
  .toast{font-size:10.5px; color:#9be8a8; margin-top:8px; min-height:14px;}
</style>
</head>
<body>
<div class="chrome">
  <div class="hud">
    <div class="hud-left">
      <span style="font-size:24px">🏢</span>
      <div>
        <h1>AXIA AI社員オフィス <span style="font-size:11px;color:var(--gold)">3D</span></h1>
        <div class="sub" id="sub">axia_cowork_office と Realtime連携中</div>
      </div>
    </div>
    <div class="hud-chips" id="chips"></div>
  </div>

  <div class="main-layout">
    <div class="stage-wrap">
      <div id="stage">
        <div class="loading" id="loading">3Dオフィスを読み込み中…</div>
        <div class="label-layer" id="labels"></div>
        <div class="hint">ドラッグで回転 / ピンチでズーム / 社員をタップで選択</div>
        <div class="cam-btns">
          <button class="cam-btn on" id="btnSpin">自動回転 ON</button>
          <button class="cam-btn" id="btnReset">視点リセット</button>
          <button class="cam-btn" id="btnFull">全画面</button>
        </div>
      </div>
    </div>

    <div class="side-col">
      <div class="throne">
        <h2>🗣 くろへ指示</h2>
        <div class="desc">くろが受けて担当の社員に振るばい。指示された社員は席に戻って作業を始めるっちゃ。</div>
        <select id="who"><option value="">— 誰に指示する？ —</option></select>
        <input id="msg" placeholder="例：NET4.5%以上だけ選別して">
        <button id="send" disabled>指示を出す</button>
        <div class="toast" id="toast"></div>
      </div>

      <div class="panel">
        <h2>🚶 社員の行動ルール</h2>
        <div class="rule">
          <b>進行中</b> … 席に着いて作業（腕が動く）<br>
          <b>未着手</b> … 社内をうろうろ歩き回る<br>
          <b>保留・完了</b> … 休憩室のソファでひと休み<br>
          <b>活動ログ</b> … 奥の壁掛けモニターに表示
        </div>
      </div>
    </div>
  </div>
</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

/* ═══════════ Supabase ═══════════ */
const SUPABASE_URL = 'https://zrqdoorolwvjlwuatlkc.supabase.co';
const SUPABASE_KEY = 'sb_publishable_qTfps32ER4iHTo_o3zkCEw_HlJdMq_c';
const TABLE = 'axia_cowork_office';
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const STATUS_COLOR = {未着手:'#9c93b0', 進行中:'#4f8ef7', 完了:'#3fae6a', 保留:'#e8a33d'};
const HAIR  = ['#3fae6a','#f06292','#5b8def','#8e5bd6','#7a4e2d','#e8c34a','#d35b4e','#3a3a4a'];
const SHIRT = ['#4f8ef7','#e8638c','#3fae6a','#e0b23e','#8e5bd6','#4fb8c4','#c96a4e','#5a6acf'];

/* ═══════════ レイアウト定義 ═══════════ */
const DESKS = {
  3:{col:0,row:0,plate:'宅建学習'},
  4:{col:2,row:0,plate:'経理'},
  1:{col:0,row:1,plate:'仕入れ（マイソク）'},
  2:{col:2,row:1,plate:'仕入れ（契約書）'},
  7:{col:0,row:2,plate:'採用HR'},
  6:{col:2,row:2,plate:'業務・総務'},
  // 社長席：休憩室と同じ右列に、横向き（オフィス側を向く）で配置
  5:{plate:'社長席', solo:{
       x: 6.9, z: -3.6, rotY: -Math.PI/2,
       seat:     { x: 7.8, z: -3.6 },
       approach: { x: 7.8, z: -5.5 },
     }},
};
const SPACING = 3.4;
const gridX = c => (c - 1) * SPACING;
const gridZ = r => (r - 1) * SPACING;

// 通路のZライン（机の間の空きレーン）。行の「後ろ側」から席に入る。
const AISLE_Z   = [-5.5, -2.15, 1.25, 5.0];
const AISLE_X   = [-5.2, -1.7, 0, 1.7, 5.2];
const LANES_X   = [-5.2, -1.7, 0, 1.7];           // 縦に移動できる（机が無い）列
const ROW_BACK_Z = { 0:-5.5, 1:-2.15, 2:1.25 };   // 各行の背後の通路

// 休憩室（右手のオープンラウンジ）
const LOUNGE_LANE_X = 6.0;                        // ソファ手前の縦通路
const SOFA_SEATS = [
  { x: 6.9, z: -1.05 },
  { x: 6.9, z:  0.0  },
  { x: 6.9, z:  1.05 },
];

const V3 = (x, z) => new THREE.Vector3(x, 0, z);

const deskSeat = id => {
  const d = DESKS[id];
  return d.solo ? V3(d.solo.seat.x, d.solo.seat.z)
                : V3(gridX(d.col), gridZ(d.row) - 0.9);
};
const deskApproach = id => {
  const d = DESKS[id];
  return d.solo ? V3(d.solo.approach.x, d.solo.approach.z)
                : V3(gridX(d.col), ROW_BACK_Z[d.row]);
};
const seatYaw = id => {
  const d = DESKS[id];
  return d.solo ? Math.PI + d.solo.rotY : Math.PI;   // 机（+z）を向く姿勢＋机の回転
};

const WAYPOINTS = [];
AISLE_X.forEach(x => AISLE_Z.forEach(z => WAYPOINTS.push(V3(x, z))));

/* ═══════════ Scene ═══════════ */
const stage = document.getElementById('stage');
const labelLayer = document.getElementById('labels');

const scene = new THREE.Scene();
scene.background = new THREE.Color('#fdf5e6');

const camera = new THREE.PerspectiveCamera(42, 1, 0.1, 100);
const HOME = new THREE.Vector3(8.5, 7.6, 10.5);
camera.position.copy(HOME);

const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
stage.appendChild(renderer.domElement);

const labelRenderer = new CSS2DRenderer({ element: labelLayer });
labelRenderer.domElement.style.position = 'absolute';
labelRenderer.domElement.style.top = '0';
labelRenderer.domElement.style.pointerEvents = 'none';

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.enablePan = false;
controls.minDistance = 7;
controls.maxDistance = 24;
controls.minPolarAngle = 0.25;
controls.maxPolarAngle = Math.PI/2 - 0.12;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.5;
controls.target.set(1.1, 0.9, 0);

scene.add(new THREE.HemisphereLight('#ffffff', '#e3d3b0', 0.95));
const sun = new THREE.DirectionalLight('#fff3dc', 1.15);
sun.position.set(6, 12, 6);
sun.castShadow = true;
sun.shadow.mapSize.set(1024,1024);
sun.shadow.camera.left = -13; sun.shadow.camera.right = 13;
sun.shadow.camera.top = 13;  sun.shadow.camera.bottom = -13;
sun.shadow.bias = -0.0006;
scene.add(sun);
scene.add(new THREE.AmbientLight('#ffffff', 0.28));

/* 床（右にラウンジ分を延長） */
const floor = new THREE.Mesh(
  new THREE.BoxGeometry(15.5, 0.4, 12.8),
  new THREE.MeshLambertMaterial({ color:'#f3e7cf' })
);
floor.position.set(1.1, -0.2, 0);
floor.receiveShadow = true;
scene.add(floor);

/* 社長席のラグ（ラウンジと同じ幅に揃える） */
const rug = new THREE.Mesh(
  new THREE.BoxGeometry(3.6, 0.06, 2.8),
  new THREE.MeshLambertMaterial({ color:'#f5dfa4' })
);
rug.position.set(6.4, 0.03, -3.7);
rug.receiveShadow = true;
scene.add(rug);

/* ═══════════ 休憩室 ═══════════ */
function buildLounge(){
  const g = new THREE.Group();

  const loungeRug = new THREE.Mesh(
    new THREE.BoxGeometry(3.6, 0.05, 4.4),
    new THREE.MeshLambertMaterial({ color:'#efe0c2' })
  );
  loungeRug.position.set(6.4, 0.025, 0);
  loungeRug.receiveShadow = true;
  g.add(loungeRug);

  const fabric = new THREE.MeshLambertMaterial({ color:'#8e7fb8' });
  const base = new THREE.Mesh(new THREE.BoxGeometry(1.1, 0.45, 3.3), fabric);
  base.position.set(6.95, 0.225, 0); base.castShadow = true; base.receiveShadow = true; g.add(base);
  const back = new THREE.Mesh(new THREE.BoxGeometry(0.28, 0.75, 3.3), fabric);
  back.position.set(7.62, 0.6, 0); back.castShadow = true; g.add(back);
  const armA = new THREE.Mesh(new THREE.BoxGeometry(1.1, 0.62, 0.24), fabric);
  armA.position.set(6.95, 0.5, -1.65); armA.castShadow = true; g.add(armA);
  const armB = armA.clone(); armB.position.z = 1.65; g.add(armB);

  // ローテーブル（縦通路 x=6.0 にかからない位置）
  const tableMat = new THREE.MeshLambertMaterial({ color:'#c89b6a' });
  const tTop = new THREE.Mesh(new THREE.BoxGeometry(0.9, 0.09, 1.9), tableMat);
  tTop.position.set(5.2, 0.42, 0); tTop.castShadow = true; g.add(tTop);
  const legGeo = new THREE.BoxGeometry(0.08, 0.42, 0.08);
  const legMat = new THREE.MeshLambertMaterial({ color:'#a5764a' });
  [[-0.34,-0.8],[0.34,-0.8],[-0.34,0.8],[0.34,0.8]].forEach(([dx,dz])=>{
    const l = new THREE.Mesh(legGeo, legMat);
    l.position.set(5.2+dx, 0.21, dz); g.add(l);
  });

  // コーヒーカップ
  const cupMat = new THREE.MeshLambertMaterial({ color:'#ffffff' });
  [-0.5, 0.35].forEach(dz => {
    const cup = new THREE.Mesh(new THREE.CylinderGeometry(0.07,0.06,0.14,10), cupMat);
    cup.position.set(5.2, 0.53, dz); cup.castShadow = true; g.add(cup);
  });

  // 観葉植物（通路の外側）
  const pot = new THREE.Mesh(new THREE.CylinderGeometry(0.22,0.17,0.34,10),
    new THREE.MeshLambertMaterial({ color:'#c96a4e' }));
  pot.position.set(7.7, 0.17, 2.6); pot.castShadow = true; g.add(pot);
  const leaf = new THREE.Mesh(new THREE.SphereGeometry(0.42, 10, 8),
    new THREE.MeshLambertMaterial({ color:'#5aa96a' }));
  leaf.position.set(7.7, 0.62, 2.6); leaf.castShadow = true; g.add(leaf);

  scene.add(g);

  const zoneEl = document.createElement('div');
  zoneEl.className = 'tag zone';
  zoneEl.textContent = '☕ 休憩室';
  const zoneObj = new CSS2DObject(zoneEl);
  zoneObj.position.set(6.4, 1.7, 2.9);
  scene.add(zoneObj);
}
buildLounge();

/* ═══════════ 奥の壁 ＋ 活動ログ大型モニター ═══════════ */
const wall = new THREE.Mesh(
  new THREE.BoxGeometry(12.6, 6.2, 0.25),
  new THREE.MeshLambertMaterial({ color:'#fffaf0' })
);
wall.position.set(0, 3.1, -6.2);
wall.receiveShadow = true;
wall.castShadow = true;
scene.add(wall);

// ログ描画用キャンバス
const LOG_W = 1280, LOG_H = 640;
const logCanvas = document.createElement('canvas');
logCanvas.width = LOG_W; logCanvas.height = LOG_H;
const lg = logCanvas.getContext('2d');
const logTexture = new THREE.CanvasTexture(logCanvas);
logTexture.colorSpace = THREE.SRGBColorSpace;

// モニター本体（ベゼル＋画面）
const bezel = new THREE.Mesh(
  new THREE.BoxGeometry(9.0, 4.9, 0.16),
  new THREE.MeshLambertMaterial({ color:'#2b2440' })
);
bezel.position.set(0, 3.35, -6.1);
bezel.castShadow = true;
scene.add(bezel);

const logScreen = new THREE.Mesh(
  new THREE.PlaneGeometry(8.55, 4.5),
  new THREE.MeshBasicMaterial({ map: logTexture })
);
logScreen.position.set(0, 3.35, -6.01);
scene.add(logScreen);

// 画面下のスタンドライト風ライン
const bar = new THREE.Mesh(
  new THREE.BoxGeometry(9.0, 0.1, 0.18),
  new THREE.MeshBasicMaterial({ color:'#e8a33d' })
);
bar.position.set(0, 0.78, -6.1);
scene.add(bar);

const logs = [];
function wrapText(text, maxWidth){
  const out = [];
  let line = '';
  for (const ch of text){
    if (lg.measureText(line + ch).width > maxWidth && line){ out.push(line); line = ch; }
    else line += ch;
  }
  if (line) out.push(line);
  return out;
}

function drawLog(){
  // 背景
  lg.fillStyle = '#1c1733';
  lg.fillRect(0, 0, LOG_W, LOG_H);

  // ヘッダー
  lg.fillStyle = '#e8a33d';
  lg.fillRect(0, 0, LOG_W, 88);
  lg.fillStyle = '#2b2440';
  lg.font = 'bold 48px "M PLUS Rounded 1c", sans-serif';
  lg.textBaseline = 'middle';
  lg.fillText('活動ログ', 36, 46);
  lg.font = '26px "DM Mono", monospace';
  lg.fillText('AXIA AI OFFICE — LIVE', 300, 48);

  if (!logs.length){
    lg.fillStyle = '#6b6280';
    lg.font = '32px "Zen Maru Gothic", sans-serif';
    lg.fillText('まだ動きなし。指示を出すと ここに流れるばい。', 36, 168);
    logTexture.needsUpdate = true;
    return;
  }

  let y = 142;
  for (const l of logs){
    if (y > LOG_H - 44) break;

    lg.font = '27px "DM Mono", monospace';
    lg.fillStyle = '#8d84ad';
    lg.fillText(l.time, 36, y);

    lg.font = 'bold 34px "M PLUS Rounded 1c", sans-serif';
    lg.fillStyle = '#e8a33d';
    lg.fillText(l.name, 150, y);
    const nameW = lg.measureText(l.name).width;

    lg.font = '31px "Zen Maru Gothic", sans-serif';
    lg.fillStyle = '#f4f0ff';
    const startX = 150 + nameW + 20;
    const lines = wrapText(l.text, LOG_W - startX - 36);
    lines.slice(0, 2).forEach((line, i) => {
      lg.fillText(line, i === 0 ? startX : 150, y + i * 38);
    });
    y += 38 * Math.min(lines.length, 2) + 26;
  }
  logTexture.needsUpdate = true;
}

function pushLog(name, text){
  const time = new Date().toLocaleTimeString('ja-JP', {hour:'2-digit', minute:'2-digit'});
  logs.unshift({ time, name, text });
  if (logs.length > 12) logs.pop();
  drawLog();
}

/* ═══════════ 経路（机・家具を避けて通路だけを通る） ═══════════ */
const nearestAisleZ = z => AISLE_Z.reduce((a,b) => Math.abs(b-z) < Math.abs(a-z) ? b : a);
const nearestLaneX  = x => LANES_X.reduce((a,b) => Math.abs(b-x) < Math.abs(a-x) ? b : a);

/* 現在地 → 縦レーン laneX の crossZ まで出るまでの経路 */
function seg(a, laneX, crossZ, fromLounge){
  const p = a.worker.position;
  const out = [];
  let cx = p.x, cz = p.z;

  // ソファに座っていた場合は、まずソファ手前の縦通路へ抜ける
  if (fromLounge && cx > 5.6){
    out.push(V3(LOUNGE_LANE_X, cz));
    cx = LOUNGE_LANE_X;
    const ez = cz >= 0 ? 1.25 : -2.15;
    if (Math.abs(cz - ez) > 0.08){ out.push(V3(cx, ez)); cz = ez; }
  }

  const az = nearestAisleZ(cz);
  if (Math.abs(cz - az) > 0.08){ out.push(V3(cx, az)); cz = az; }        // 通路まで下がる
  if (Math.abs(cx - laneX) > 0.08){ out.push(V3(laneX, az)); cx = laneX; } // 通路を横移動
  if (Math.abs(crossZ - az) > 0.08){ out.push(V3(laneX, crossZ)); }       // 縦レーンを移動
  return out;
}

const loungeSeatsTaken = {};
function claimSeat(a){
  if (a.seatIdx !== null) return a.seatIdx;
  for (let i = 0; i < SOFA_SEATS.length; i++){
    if (!loungeSeatsTaken[i]){ loungeSeatsTaken[i] = a.id; a.seatIdx = i; return i; }
  }
  return null;
}
function releaseSeat(a){
  if (a.seatIdx !== null){ delete loungeSeatsTaken[a.seatIdx]; a.seatIdx = null; }
}

function goDesk(a){
  const wasLounge = (a.mode === 'lounge');
  releaseSeat(a);
  a.mode = 'desk';
  const ap = deskApproach(a.id), seat = deskSeat(a.id);
  a.path = [...seg(a, nearestLaneX(ap.x), ap.z, wasLounge), V3(ap.x, ap.z), seat];
}
function goLounge(a){
  const wasLounge = (a.mode === 'lounge');
  const i = claimSeat(a);
  if (i === null){ goWander(a); return; }   // 満席なら歩き回る
  a.mode = 'lounge';
  const s = SOFA_SEATS[i];
  const cz = s.z >= 0 ? 1.25 : -2.15;
  a.path = [...seg(a, 1.7, cz, wasLounge), V3(LOUNGE_LANE_X, cz), V3(LOUNGE_LANE_X, s.z), V3(s.x, s.z)];
}
function goWander(a){
  const wasLounge = (a.mode === 'lounge');
  releaseSeat(a);
  a.mode = 'wander';
  const wp = WAYPOINTS[Math.floor(Math.random() * WAYPOINTS.length)];
  a.path = [...seg(a, nearestLaneX(wp.x), wp.z, wasLounge), V3(wp.x, wp.z)];
}

function desiredMode(status){
  if (status === '進行中') return 'desk';
  if (status === '保留' || status === '完了') return 'lounge';
  return 'wander';
}

function applyRow(r){
  const a = A[r.id];

  a.tagEl.querySelector('.nm').textContent = av.name || DESKS[r.id].plate;
  a.tagEl.querySelector('.pip').style.background = STATUS_COLOR[r.status] || '#9c93b0';
  a.tagEl.classList.toggle('selected', selectedId === r.id);

  const text = r.memo || r.task_name || '';
  a.bubEl.textContent = text;
  a.bubObj.visible = !!text && (r.status === '進行中' || selectedId === r.id);

  const scr = a.desk.userData.screen;
  if (scr) scr.material.color.set(r.status === '進行中' ? '#8fd4ff' : '#7d8494');

  // 状態が変わったら行動を切り替える（前回statusと比較して確実に検知）
  const want = desiredMode(r.status);
  const statusChanged = (a.status !== r.status);
  if (want !== a.mode || (want === 'desk' && statusChanged)){
    if (want === 'desk')        goDesk(a);
    else if (want === 'lounge') goLounge(a);
    else                        goWander(a);
  }
  a.status = r.status;
}

function rebuildColors(){
  rows.forEach(r => {
    const a = A[r.id];
    if (!a) return;
    const av = r.avatar || {};
    const hairColor  = HAIR[Number.isInteger(av.hair) ? av.hair % HAIR.length : 4];
    const shirtColor = SHIRT[Number.isInteger(av.shirt) ? av.shirt % SHIRT.length : 0];

    const old = a.worker;
    const nw = makeWorker(hairColor, shirtColor);
    nw.position.copy(old.position);
    nw.rotation.y = old.rotation.y;
    nw.userData.deskId = r.id;
    nw.add(a.tagObj);
    nw.add(a.bubObj);
    scene.remove(old);
    scene.add(nw);
    const i = pickables.indexOf(old);
    if (i >= 0) pickables[i] = nw;
    a.worker = nw;
  });
}

const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2();
let downPos = null;

renderer.domElement.addEventListener('pointerdown', e => { downPos = {x:e.clientX, y:e.clientY}; });
renderer.domElement.addEventListener('pointerup', e => {
  if (!downPos) return;
  const moved = Math.hypot(e.clientX - downPos.x, e.clientY - downPos.y);
  downPos = null;
  if (moved > 6) return;

  const rect = renderer.domElement.getBoundingClientRect();
  pointer.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
  pointer.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
  raycaster.setFromCamera(pointer, camera);
  const hits = raycaster.intersectObjects(pickables, true);
  if (!hits.length){ selectedId = null; renderAll(); return; }

  let o = hits[0].object;
  while (o && o.userData.deskId === undefined) o = o.parent;
  if (!o) return;
  selectedId = (selectedId === o.userData.deskId) ? null : o.userData.deskId;
  renderAll();
});

let realtimeOK = false;
sb.channel('ai-office-3d')
  .on('postgres_changes', { event:'*', schema:'public', table:TABLE }, payload => {
    if (payload.eventType === 'DELETE'){
      rows = rows.filter(r => r.id !== payload.old.id);
    } else {
      const i = rows.findIndex(r => r.id === payload.new.id);
      if (i >= 0) rows[i] = payload.new; else rows.push(payload.new);
      rows.sort((a,b) => a.id - b.id);
    }
    if (payload.eventType === 'UPDATE'){
      const b = payload.old || {}, n = payload.new || {};
      const nm = (n.avatar && n.avatar.name) || n.project_name || '';
      if (b.memo !== n.memo && n.memo)      pushLog(nm, `「${n.memo}」`);
      else if (b.status !== n.status)       pushLog(nm, n.status);
    }
    renderAll();
  })
  .subscribe(status => {
    realtimeOK = (status === 'SUBSCRIBED');
    const sub = document.getElementById('sub');
    if (status === 'SUBSCRIBED')      sub.textContent = 'axia_cowork_office と Realtime連携中 🟢';
    else if (status === 'CHANNEL_ERROR' || status === 'TIMED_OUT')
                                      sub.textContent = 'Realtime未接続（自動更新で同期中）🟠';
  });

/* Realtimeが死んでても動くよう、10秒ごとにDBを読み直す保険 */
async function poll(){
  const { data, error } = await sb.from(TABLE).select('*').order('id');
  if (error || !data) return;
  let changed = false;
  data.forEach(nr => {
    const i = rows.findIndex(r => r.id === nr.id);
    if (i < 0){ rows.push(nr); changed = true; return; }
    const old = rows[i];
    if (old.status !== nr.status || old.memo !== nr.memo ||
        JSON.stringify(old.avatar) !== JSON.stringify(nr.avatar)){
      // Realtimeが取りこぼした変化をログに出す
      if (!realtimeOK){
        const nm = (nr.avatar && nr.avatar.name) || nr.project_name || '';
        if (old.memo !== nr.memo && nr.memo) pushLog(nm, `「${nr.memo}」`);
        else if (old.status !== nr.status)   pushLog(nm, nr.status);
      }
      rows[i] = nr; changed = true;
    }
  });
  if (changed){ rows.sort((a,b)=>a.id-b.id); renderAll(); }
}
setInterval(poll, 10000);

const SPEED = 1.35;              // 歩く速さ（単位/秒）

function stepAvatar(a, dt, t){
  const w = a.worker;
  const p = w.position;

  if (a.path.length){
    // ── 移動中 ──
    const tgt = a.path[0];
    const dx = tgt.x - p.x, dz = tgt.z - p.z;
    const dist = Math.hypot(dx, dz);

    if (dist < 0.06){
      a.path.shift();
      if (!a.path.length){
        // 到着
        if (a.mode === 'desk')        a.yaw = seatYaw(a.id);
        else if (a.mode === 'lounge') a.yaw = yawTo(-1, 0);        // ソファは office 側（-x）を向く
        else                          a.waitUntil = t + 1.5 + Math.random() * 3.5;
      }
    } else {
      if (w.userData.sitting) setPose(w, false);
      const k = Math.min(1, (SPEED * dt) / dist);
      p.x += dx * k; p.z += dz * k;
      a.yaw = yawToward({x:p.x - dx*k, z:p.z - dz*k}, tgt);

      // 歩行モーション
      const sw = Math.sin(t * 9 + a.id) * 0.5;
      w.userData.legL.rotation.x = -Math.PI/2 + sw;
      w.userData.legR.rotation.x = -Math.PI/2 - sw;
      w.userData.armL.rotation.x = -Math.PI/2 - sw * 0.5;
      w.userData.armR.rotation.x = -Math.PI/2 + sw * 0.5;
      w.position.y = Math.abs(Math.sin(t * 9 + a.id)) * 0.035;
    }
  } else {
    // ── 到着後 ──
    if (a.mode === 'desk' || a.mode === 'lounge'){
      if (!w.userData.sitting) setPose(w, true);
      w.position.y = 0;

      if (a.mode === 'desk' && a.status === '進行中'){
        // タイピング
        const s = Math.sin(t * 9 + a.id) * 0.12;
        w.userData.armL.rotation.x =  s;
        w.userData.armR.rotation.x = -s;
        w.position.y = Math.sin(t * 6 + a.id) * 0.02;
      }
      // 休憩中はゆっくり首を振る
      w.userData.head.rotation.y = Math.sin(t * (a.mode === 'lounge' ? 0.5 : 1.4) + a.id) * (a.mode === 'lounge' ? 0.25 : 0.08);
    } else {
      // うろうろ待機中：立ち止まってきょろきょろ
      if (w.userData.sitting) setPose(w, false);
      w.position.y = 0;
      w.userData.head.rotation.y = Math.sin(t * 0.7 + a.id) * 0.35;
      if (t > a.waitUntil) goWander(a);
    }
  }

  // 向きを滑らかに合わせる
  let d = a.yaw - w.rotation.y;
  while (d >  Math.PI) d -= Math.PI * 2;
  while (d < -Math.PI) d += Math.PI * 2;
  w.rotation.y += d * Math.min(1, dt * 9);
}

function animate(){
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  const t  = clock.elapsedTime;
  Object.values(A).forEach(a => stepAvatar(a, dt, t));
  controls.update();
  renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
}
animate();
</script>
